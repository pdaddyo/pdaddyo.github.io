\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Self-pull / Zipline<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">On foot, hooking a tree or building <b style=\"color:#e9e9f2\">yanks you to it<\u002Fb> with brief i-frames — cross gaps and close on ranged enemies fast.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Hook-Jump<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">{{ tC }} MID-PULL<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Cancel a self-pull partway and you <b style=\"color:#e9e9f2\">launch off<\u002Fb> in that direction with i-frames — a hook-powered leap.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Foot-Swing<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">R MID-PULL<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Re-press the hook during a self-pull to convert it into a <b style=\"color:#e9e9f2\">pendulum swing<\u002Fb> around the tree, on foot.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(53,214,255,.3);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Cornering Swing <span style=\"font-size:11px;color:#7fe4ff\">(racer)<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">While racing, hooking a tree turns it into a <b style=\"color:#e9e9f2\">tight pendulum turn<\u002Fb> that <b style=\"color:#e9e9f2\">builds speed<\u002Fb> as you round it — then <b style=\"color:#e9e9f2\">slingshots<\u002Fb> you out on release. The fastest way through a bend.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Orbit Attack<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">R MID-SWING<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Re-press during a swing to <b style=\"color:#e9e9f2\">auto-strike along the cable<\u002Fb>, mowing anything between you and the anchor as you circle.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Racer Whip<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">At speed, the outgoing cable itself can <b style=\"color:#e9e9f2\">whip past enemies<\u002Fb> for a drive-by hit without stopping your run.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SUPPORT & UTILITY -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#4dffa0;margin:8px 0 14px\">▸ SUPPORT &amp; UTILITY<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #4dffa0;border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Reel a downed ally<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hook a <b style=\"color:#e9e9f2\">downed teammate<\u002Fb> to drag them out of danger — and the cable <b style=\"color:#e9e9f2\">revives them<\u002Fb> as you pull. A lifesaver from across the room.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #4dffa0;border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Tag-Pull a teammate<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hook a <b style=\"color:#e9e9f2\">standing<\u002Fb> ally to yank them to you with i-frames — regroup instantly or save a partner about to be surrounded.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Redirect projectiles<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Sweep the cable through an <b style=\"color:#e9e9f2\">enemy bullet or grenade<\u002Fb> and it flips ownership — sending the shot back the way it came.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Reel chests &amp; loot<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hook a <b style=\"color:#e9e9f2\">chest<\u002Fb> to slide it right in front of you, or drag scattered <b style=\"color:#e9e9f2\">pickups<\u002Fb> toward you along the cable. Lazy looting, encouraged.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Rip up cover<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hooking certain terrain can tear loose a chunk of <b style=\"color:#e9e9f2\">cover<\u002Fb> that plants beside you to soak incoming fire.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Re-fire instantly<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">There's essentially <b style=\"color:#e9e9f2\">no cooldown<\u002Fb> — a whiff snaps back fast and a fresh press re-fires immediately. Spam it to find your grab.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n        <!-- ============ BUILDING ============ -->\n    <section id=\"build\" data-screen-label=\"Building\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">06<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">Building &amp; the <span style=\"color:#ffce54\">Grid<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#ffce54,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:720px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 24px\">Restoring the signal means powering the map's <b style=\"color:#e9e9f2\">relays<\u002Fb>, and holding them takes fortifications. Drop into <b style=\"color:#ffce54\">Build mode<\u002Fb> to lay a power grid and plant automated defenses, paid for with <b style=\"color:#ffce54\">scrap<\u002Fb> you loot from kills.<\u002Fp>\n\n      <!-- build controls -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#ffce54;margin:6px 0 14px\">▸ BUILD CONTROLS<\u002Fdiv>\n      <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 24px;margin-bottom:26px\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px 26px\">\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;height:26px;font-family:'Chakra Petch';font-weight:700;font-size:11px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">{{ lBuildToggle }}<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Enter / exit build<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Toggles build mode.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;height:26px;font-family:'Chakra Petch';font-weight:700;font-size:11px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">{{ lBuildCycle }}<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Cycle the piece<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Moves to the next build item.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 8px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">Stick<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Aim the spot<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Nudge the placement around you. <span style=\"color:#6d6d82\">KB: move + mouse<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\">{{ gBuildHoldEl }}<div><div style=\"font-weight:700;font-size:14px\">Build / repair (hold)<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Hold to raise it, patch it, or splice a cable.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\">{{ gCancelEl }}<div><div style=\"font-weight:700;font-size:14px\">Back out<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Leaves build mode. <span style=\"color:#6d6d82\">KB: B<\u002Fspan><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:#8a8a9c;line-height:1.5;margin:16px 0 0\">You're rooted while a build/repair hold is charging — pylons and the Remove tool finish quickly; turrets take about twice as long.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- the grid -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#ffce54;margin:6px 0 14px\">▸ THE POWER GRID<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-bottom:26px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #40e0ff;border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Pylons &amp; power<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\"><b style=\"color:#e9e9f2\">Pylons<\u002Fb> string cables out from your base to the relays and your turrets. A defense only runs while it's <b style=\"color:#e9e9f2\">wired to a powered pylon<\u002Fb> — plan the route before you plant guns.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #ffce54;border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Scrap economy<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Enemies drop <b style=\"color:#ffce54\">scrap<\u002Fb> — your build currency. The first pylon on each route is <b style=\"color:#e9e9f2\">free<\u002Fb>, and building or repairing near already-powered nodes goes faster.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #ff4d4d;border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Keep it repaired<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Enemy hits and passive stress <b style=\"color:#e9e9f2\">break cables and pylons<\u002Fb>. Hold build on a damaged piece to <b style=\"color:#e9e9f2\">patch<\u002Fb> it, or on a break to <b style=\"color:#e9e9f2\">splice / rebuild<\u002Fb>. Markers flag <span style=\"color:#ffb14d;font-weight:700\">WEAK<\u002Fspan> / <span style=\"color:#ffb14d;font-weight:700\">FIX<\u002Fspan> / <span style=\"color:#ffb14d;font-weight:700\">SPLICE<\u002Fspan>.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- defences -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#ffce54;margin:6px 0 14px\">▸ WHAT YOU CAN BUILD<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px;color:#7fe4ff\">Gun Turret<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#40e0ff;border-radius:4px;padding:4px 6px\">LONG RANGE<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0 0 10px\">Auto-fires fast at anything in a wide radius. Your workhorse — line the approaches with these.<\u002Fp><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-family:'Silkscreen';font-size:8px;color:#9be9ff;background:rgba(64,224,255,.1);border:1px solid rgba(64,224,255,.25);border-radius:5px;padding:4px 6px\">RANGE 8.6<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#9be9ff;background:rgba(64,224,255,.1);border:1px solid rgba(64,224,255,.25);border-radius:5px;padding:4px 6px\">104 HP<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px;color:#ff9a5a\">Flamethrower<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ff7a2d;border-radius:4px;padding:4px 6px\">BURN<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0 0 10px\">Short cone that sets enemies alight for damage-over-time. Brutal in a chokepoint where the crowd funnels.<\u002Fp><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-family:'Silkscreen';font-size:8px;color:#ffbf8a;background:rgba(255,122,45,.1);border:1px solid rgba(255,122,45,.25);border-radius:5px;padding:4px 6px\">RANGE 4.3<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#ffbf8a;background:rgba(255,122,45,.1);border:1px solid rgba(255,122,45,.25);border-radius:5px;padding:4px 6px\">82 HP<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px;color:#c3a7ff\">Shockwave<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#a98bff;border-radius:4px;padding:4px 6px\">KNOCKBACK<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0 0 10px\">Pulses a close-range blast that shoves attackers off — protects the pylons and relays it stands next to.<\u002Fp><div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-family:'Silkscreen';font-size:8px;color:#cfbaff;background:rgba(169,139,255,.1);border:1px solid rgba(169,139,255,.25);border-radius:5px;padding:4px 6px\">RANGE 3.35<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#cfbaff;background:rgba(169,139,255,.1);border:1px solid rgba(169,139,255,.25);border-radius:5px;padding:4px 6px\">124 HP<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Pylon<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#40e0ff;border-radius:4px;padding:4px 6px\">POWER<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Extends the grid. Chain pylons to carry power to distant relays and turrets. Cheap and quick to raise.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px;color:#ff6a5a\">Remove<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ff4d4d;border-radius:4px;padding:4px 6px\">TOOL<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Not a placeable — clears your built pylons and defenses in a small zone so you can re-route.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ CO-OP ============ -->\n    <section id=\"coop\" data-screen-label=\"Co-op Tech\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">07<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">Co-op <span style=\"color:#4dffa0\">tech<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#4dffa0,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:720px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 26px\">Two players aren't just double the guns — the game actively <b style=\"color:#e9e9f2\">rewards fighting together<\u002Fb>. Split the enemy's attention, cover each other's mistakes, and stack kills to snowball a wave.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px\">\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(77,255,160,.06),transparent);border:1px solid rgba(77,255,160,.24);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Auto-Revive<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">A downed teammate is revived just by a partner <b style=\"color:#e9e9f2\">standing close<\u002Fb> for ~2s — no button needed. Taking a hit or getting shoved <b style=\"color:#e9e9f2\">interrupts<\u002Fb> it, so clear the area first.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(77,255,160,.06),transparent);border:1px solid rgba(77,255,160,.24);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Rally buff<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#4dffa0;border-radius:4px;padding:4px 6px\">RALLY!<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">A successful save fires up <b style=\"color:#e9e9f2\">both<\u002Fb> players — bonus damage and speed for a few seconds. A revive swings the fight back instead of just breaking even.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(77,255,160,.06),transparent);border:1px solid rgba(77,255,160,.24);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Crossfire<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">+35% DMG<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hit an enemy your <b style=\"color:#e9e9f2\">teammate just hit<\u002Fb> and your blow lands harder, popping <span style=\"color:#7fe4ff;font-weight:700\">CROSSFIRE!<\u002Fspan>. Focus the same target to melt it.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(77,255,160,.06),transparent);border:1px solid rgba(77,255,160,.24);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Kill Streaks<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ffa53d;border-radius:4px;padding:4px 6px\">DOUBLE · TRIPLE<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Rapid kills by <b style=\"color:#e9e9f2\">either<\u002Fb> player chain into <b style=\"color:#e9e9f2\">Double / Triple / Quad Kill<\u002Fb> banners. Keep the pressure on to keep the streak alive.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(77,255,160,.06),transparent);border:1px solid rgba(77,255,160,.24);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Rampage<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ff8a3d;border-radius:4px;padding:4px 6px\">ON FIRE!<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Push the streak to <b style=\"color:#e9e9f2\">4 kills<\u002Fb> and the whole team goes <span style=\"color:#ff9a5a;font-weight:700\">ON FIRE!<\u002Fspan> — everyone gets the Rally buff at once. Streaks pay out for real.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(181,123,255,.06),transparent);border:1px solid rgba(181,123,255,.26);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px;color:#c9a7ff\">Hook rescues<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Your hook is a rescue tool: <b style=\"color:#e9e9f2\">reel a downed ally to safety<\u002Fb> (reviving as you pull) or <b style=\"color:#e9e9f2\">tag-pull a standing partner<\u002Fb> to you. See section 05.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(53,214,255,.06),transparent);border:1px solid rgba(53,214,255,.24);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Co-op Dash Link<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Dash past a teammate to <b style=\"color:#e9e9f2\">tow them along + shield you both<\u002Fb> with i-frames. Chain escapes together.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Support kit<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">The <b style=\"color:#e9e9f2\">Heal Pulse<\u002Fb> ability and a <b style=\"color:#e9e9f2\">Medic Drone<\u002Fb> top up nearby allies, and the <b style=\"color:#e9e9f2\">Second Wind<\u002Fb> passive lets you survive one lethal hit. Build a rescuer.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Down &amp; out<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">If nobody saves you in time you <b style=\"color:#e9e9f2\">bleed out<\u002Fb>. Solo, you respawn back at the crash site; in extraction runs a downed player stays down until revived — so <b style=\"color:#e9e9f2\">never fight alone<\u002Fb>.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ CHEAT SHEET ============ -->\n    <section id=\"cheat\" data-screen-label=\"Cheat Sheet\" style=\"padding:34px 0 20px;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">08<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">Callout cheat-sheet<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#8a8a9c,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:700px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 22px\">Those flashing words over your head are the game telling you a skill move paid off. Most of them add to your <span style=\"color:#ff3d8b;font-weight:700\">Flow<\u002Fspan>. Chase them.<\u002Fp>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px\">\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#ffdc40;margin-bottom:3px\">PERFECT!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Switched weapons on the earliest beat of the Super window.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#7fe4ff;margin-bottom:3px\">CROSSFIRE!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">You hit a foe your teammate just hit — bonus damage.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#5affa0;margin-bottom:3px\">RALLY!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">A revive buffed both of you — damage &amp; speed.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#ff9a5a;margin-bottom:3px\">ON FIRE!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Team hit a 4-kill streak — everyone gets Rally.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#8efff0;margin-bottom:3px\">PARRY! <span style=\"font-size:10px;color:#60ffff\">+FLOW<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Focus-dashed into a winding-up enemy and cancelled it.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#9effff;margin-bottom:3px\">COUNTER! <span style=\"font-size:10px;color:#60ffff\">+FLOW<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Hooked an enemy mid-telegraph and shut it down.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#c9a7ff;margin-bottom:3px\">PERFECT THROW! <span style=\"font-size:10px;color:#60ffff\">+FLOW<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Released a spun mob dead-on its spin direction.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#bfe6ff;margin-bottom:3px\">GRAZE! <span style=\"font-size:10px;color:#60ffff\">+FLOW<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">A shot skimmed past you — near-miss refunds dash &amp; Flow.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#8fc7eb;margin-bottom:3px\">DEFLECT! <span style=\"font-size:10px;color:#60ffff\">+FLOW<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">A melee swing batted a hostile bullet back at the enemy.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#fff0b8;margin-bottom:3px\">PERFECT DODGE! <span style=\"font-size:10px;color:#60ffff\">+FLOW<\u002Fspan><\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Dashed through a bullet that would've hit — brief slow-mo.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#ff6a4a;margin-bottom:3px\">OVERKILL!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">A killing blow way overshot — detonates an AoE blast.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#ffab33;margin-bottom:3px\">PUNISH!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Hit an enemy in its weak spot / recovery window for extra damage.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#f28cff;margin-bottom:3px\">BACKSTAB!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Struck an enemy from behind for a critical.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#ffab6b;margin-bottom:3px\">POINT BLANK!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">Landed a shot right in an enemy's face for a critical.<\u002Fdiv><\u002Fdiv>\n        <div style=\"background:#0d0d15;border:1px solid rgba(255,77,77,.28);border-radius:11px;padding:14px 16px\"><div style=\"font-family:'Chakra Petch';font-weight:700;font-size:15px;color:#ff5a4a;margin-bottom:3px\">FLOW LOST!<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.45\">You got hit or overheated — your chain drained. Reset and rebuild.<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:34px;padding-top:22px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-family:'Silkscreen';font-size:13px\"><span style=\"color:#ff3d8b\">STRAN<\u002Fspan><span style=\"color:#35d6ff\">DEAD<\u002Fspan><\u002Fspan>\n        <span style=\"font-size:12px;color:#5c5c72\">— hit, dodge, hook, switch. Then do it faster. Good luck out there.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1180,&quot;height&quot;:900},&quot;defaultController&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;xbox&quot;,&quot;tsType&quot;:&quot;'xbox'|'playstation'|'switch'|'kbm'&quot;,&quot;options&quot;:[&quot;xbox&quot;,&quot;playstation&quot;,&quot;switch&quot;,&quot;kbm&quot;],&quot;section&quot;:&quot;Control scheme&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { controller: props.defaultController || 'xbox' };\n  }\n  renderVals() {\n    const C = {\n      xbox:        { a1:'LB', a2:'RB', foc:'LT', rac:'RT', p:'X', s:'Y', d:'A', c:'B', name:'XBOX', cycle:'LB / RB', toggle:'D-pad \\u2193' },\n      playstation: { a1:'L1', a2:'R1', foc:'L2', rac:'R2', p:'\\u25A1', s:'\\u25B3', d:'\\u2715', c:'\\u25CB', name:'PLAYSTATION', cycle:'L1 / R1', toggle:'D-pad \\u2193' },\n      switch:      { a1:'L',  a2:'R',  foc:'ZL', rac:'ZR', p:'Y', s:'X', d:'B', c:'A', name:'SWITCH', cycle:'L / R', toggle:'D-pad \\u2193' },\n      kbm:         { a1:'E',  a2:'Q',  foc:'C',  rac:'R',  p:'LMB', s:'RMB', d:'Space', c:'B', name:'KEYBOARD & MOUSE', cycle:'[ ] / Tab', toggle:'B' },\n    };\n    const k = this.state.controller;\n    const c = C[k] || C.xbox;\n    const isKbm = k === 'kbm';\n    const g = (r) => (window.__resources && window.__resources['glyph_' + k + '_' + r]) || ('assets/glyph/' + k + '_' + r + '.png');\n    const padStyle = { flex: '0 0 auto', width: '30px', height: '30px', imageRendering: 'pixelated', objectFit: 'contain' };\n    const keycapStyle = { display: 'inline-flex', alignItems: 'center', justifyContent: 'center', minWidth: '30px', height: '22px', padding: '0 6px', fontFamily: 'Silkscreen', fontSize: '10px', color: '#08080c', background: '#e9e9f2', borderRadius: '5px', boxShadow: '0 2px 0 #6a6a80', flex: '0 0 auto' };\n    const kbLabel = { primary: 'LMB', secondary: 'RMB', dash: 'Space', cancel: 'B' };\n    const mk = (r, alt) => isKbm\n      ? React.createElement('span', { style: keycapStyle }, kbLabel[r])\n      : React.createElement('img', { src: g(r), alt: alt, style: padStyle });\n    const sel = (on) => on\n      ? 'background:rgba(255,61,139,.16);border-color:#ff3d8b;color:#ffffff'\n      : 'background:#0e0e16;border-color:rgba(255,255,255,.12);color:#9a9ab0';\n    return {\n      gPrimaryEl: mk('primary', 'Primary'), gSecondaryEl: mk('secondary', 'Secondary'), gDashEl: mk('dash', 'Dash'), gCancelEl: mk('cancel', 'Cancel'),\n      gBuildHoldEl: isKbm ? React.createElement('span', { style: keycapStyle }, 'F') : React.createElement('img', { src: g('dash'), alt: 'Build', style: padStyle }),\n      lA1: c.a1, lA2: c.a2, lFocus: c.foc, lRacer: c.rac,\n      tP: c.p, tS: c.s, tD: c.d, tC: c.c,\n      lBuildCycle: c.cycle, lBuildToggle: c.toggle,\n      isGamepad: !isKbm, isKbm: isKbm, schemeName: c.name,\n      xbStyle: sel(k === 'xbox'), psStyle: sel(k === 'playstation'), swStyle: sel(k === 'switch'), kbStyle: sel(isKbm),\n      setXbox: () => this.setState({ controller: 'xbox' }),\n      setPs: () => this.setState({ controller: 'playstation' }),\n      setSwitch: () => this.setState({ controller: 'switch' }),\n      setKbm: () => this.setState({ controller: 'kbm' }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
