  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r:1px solid;border-radius:9px;cursor:pointer\">Switch<\u002Fbutton>\n        <button onclick=\"{{ setKbm }}\" style=\"{{ kbStyle }};font-family:'Chakra Petch';font-weight:600;font-size:13px;padding:8px 18px;border:1px solid;border-radius:9px;cursor:pointer\">Keyboard &amp; Mouse<\u002Fbutton>\n      <\u002Fdiv>\n      <p style=\"margin:0 0 26px;font-size:11.5px;color:#5c5c72\">Swaps every button glyph and key callout in this guide to match — currently showing <b style=\"color:#9a9ab0\">{{ schemeName }}<\u002Fb>.<\u002Fp>\n\n      <div style=\"margin:0 0 6px;display:flex;align-items:center;gap:10px\">\n        <span style=\"font-family:'Silkscreen';font-size:9px;letter-spacing:1.5px;color:#ff85b6\">◈ THE MISSION<\u002Fspan>\n        <span style=\"height:1px;flex:1;background:linear-gradient(90deg,rgba(255,133,182,.5),transparent)\"><\u002Fspan>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;max-width:820px;margin:6px 0 26px;filter:drop-shadow(0 18px 40px rgba(0,0,0,.5))\">\n        <div style=\"height:12px;background-image:radial-gradient(circle,#08080c 2.3px,transparent 2.7px);background-size:16px 12px;background-position:3px 0;background-color:#1a1230;border-radius:8px 8px 0 0;border:1px solid rgba(255,61,139,.35);border-bottom:none\"><\u002Fdiv>\n        <div style=\"background:linear-gradient(160deg,#140a1e,#0a0c18 55%,#0a1420);border:1px solid rgba(255,61,139,.35);border-top:none;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 97%,97% 100%,93% 97%,89% 100%,85% 97%,81% 100%,77% 97%,73% 100%,69% 97%,65% 100%,61% 97%,57% 100%,53% 97%,49% 100%,45% 97%,41% 100%,37% 97%,33% 100%,29% 97%,25% 100%,21% 97%,17% 100%,13% 97%,9% 100%,5% 97%,1% 100%,0 97%)\">\n\n          <div style=\"position:relative;height:174px;background:radial-gradient(440px 150px at 28% 92%,rgba(255,61,139,.20),transparent 70%),radial-gradient(360px 150px at 82% 82%,rgba(53,214,255,.16),transparent 70%);border-bottom:1px solid rgba(255,255,255,.07);overflow:hidden\">\n            <div style=\"position:absolute;left:0;right:0;bottom:32px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)\"><\u002Fdiv>\n            <div style=\"position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.03) 0 1px,transparent 1px 3px);pointer-events:none\"><\u002Fdiv>\n            <img src=\"4bc5ec9c-80a4-4a67-89f6-e25bf47fd024\" alt=\"crashed ship\" style=\"position:absolute;left:32px;bottom:16px;width:152px;image-rendering:pixelated;filter:drop-shadow(0 7px 13px rgba(255,61,139,.45))\">\n            <img src=\"bf13c4dc-5a20-4519-8950-3bb7d0a66f02\" alt=\"\" style=\"position:absolute;left:150px;bottom:58px;width:74px;image-rendering:pixelated;mix-blend-mode:screen\">\n            <img src=\"0216652d-9109-4962-852b-e1743c69ba39\" alt=\"signal relay\" style=\"position:absolute;right:152px;bottom:28px;width:66px;image-rendering:pixelated;filter:drop-shadow(0 0 11px rgba(53,214,255,.55))\">\n            <img src=\"91178cf2-d6e0-41cd-b2dc-10ba0a25dcb0\" alt=\"power pylon\" style=\"position:absolute;right:104px;bottom:28px;width:40px;image-rendering:pixelated;opacity:.92\">\n            <img src=\"f112da28-90ab-4fcb-b574-44447939d822\" alt=\"racer\" style=\"position:absolute;right:26px;bottom:28px;width:70px;image-rendering:pixelated;filter:drop-shadow(0 3px 8px rgba(53,214,255,.4))\">\n            <span style=\"position:absolute;top:12px;left:14px;display:inline-flex;align-items:center;gap:6px;font-family:'Silkscreen';font-size:8px;letter-spacing:1px;color:#ff8a8a;background:rgba(0,0,0,.5);border:1px solid rgba(255,77,77,.4);border-radius:5px;padding:5px 8px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#ff4d4d;animation:sgPulse 1.2s ease-in-out infinite\"><\u002Fspan>INCOMING TRANSMISSION<\u002Fspan>\n            <div style=\"position:absolute;top:12px;right:14px;font-family:'Chakra Petch';font-weight:700;font-size:10px;color:#ff5a6a;border:2px solid #ff5a6a;border-radius:4px;padding:3px 8px;transform:rotate(-7deg);letter-spacing:1px;opacity:.9;background:rgba(0,0,0,.35)\">CLASSIFIED<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding:20px 24px 26px\">\n            <div style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(19px,2.6vw,25px);letter-spacing:.3px;margin-bottom:4px\">OPERATION: <span style=\"color:#ff85b6\">SIGNAL RESTORE<\u002Fspan><\u002Fdiv>\n            <div style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#7a7a90;margin-bottom:16px\"><span style=\"color:#8ee6c8\">T+00:00<\u002Fspan> — CRASH CONFIRMED · EVAC SIGNAL <span style=\"color:#ff5a6a;font-weight:700\">DOWN<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px;font-family:ui-monospace,Menlo,monospace;font-size:13px\">\n              <div style=\"display:flex;align-items:center;gap:11px;background:rgba(53,214,255,.06);border-left:3px solid #35d6ff;border-radius:0 8px 8px 0;padding:9px 12px\"><img src=\"0216652d-9109-4962-852b-e1743c69ba39\" style=\"width:26px;image-rendering:pixelated;flex:0 0 auto\"><div><b style=\"color:#7fe4ff\">OBJ 1<\u002Fb> <span style=\"color:#c9c9d8\">— Locate &amp; repair 3 signal relays.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:11px;background:rgba(255,206,84,.06);border-left:3px solid #ffce54;border-radius:0 8px 8px 0;padding:9px 12px\"><img src=\"e30caad2-e665-4511-9a9f-26cb3ae04d2b\" style=\"width:32px;image-rendering:pixelated;flex:0 0 auto\"><div><b style=\"color:#ffce54\">OBJ 2<\u002Fb> <span style=\"color:#c9c9d8\">— Call the extraction shuttle.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:11px;background:rgba(181,123,255,.06);border-left:3px solid #b57bff;border-radius:0 8px 8px 0;padding:9px 12px\"><img src=\"bf65f25d-1392-4ede-a370-910d59ee1a6c\" style=\"width:26px;image-rendering:pixelated;flex:0 0 auto;border-radius:5px\"><div><b style=\"color:#c9a7ff\">OBJ 3<\u002Fb> <span style=\"color:#c9c9d8\">— Hold position. Survive the countdown.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:11px;background:rgba(255,61,139,.07);border-left:3px solid #ff3d8b;border-radius:0 8px 8px 0;padding:9px 12px\"><img src=\"f112da28-90ab-4fcb-b574-44447939d822\" style=\"width:34px;image-rendering:pixelated;flex:0 0 auto\"><div><b style=\"color:#ff85b6\">OBJ 4<\u002Fb> <span style=\"color:#c9c9d8\">— Reach the pad. Get out alive.<\u002Fspan><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:16px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#b7b7c8;display:flex;align-items:center;gap:8px;flex-wrap:wrap\"><img src=\"50c6b6e4-c7f2-4936-adf8-89ed55dd03f2\" style=\"width:16px;image-rendering:pixelated\">Loot <b style=\"color:#ffce54\">scrap<\u002Fb>, build <b style=\"color:#e9e9f2\">defenses<\u002Fb>, keep the grid powered — <a href=\"#build\" style=\"color:#ff85b6;font-weight:700;text-decoration:underline\">Building &amp; the Grid<\u002Fa>.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"max-width:660px;font-size:17px;line-height:1.6;color:#c3c3d4;margin:14px 0 0\">A top-down co-op survival brawler. You crash-land, you get swarmed, you fight your way out. This guide covers everything that makes a good runner: <span style=\"color:#35d6ff;font-weight:700\">movement tech<\u002Fspan>, the <span style=\"color:#ffa53d;font-weight:700\">Focus<\u002Fspan> trigger, <span style=\"color:#ff3d8b;font-weight:700\">combos &amp; the Break-Switch super<\u002Fspan>, every <span style=\"color:#b57bff;font-weight:700\">hookshot<\u002Fspan> trick, and <span style=\"color:#4dffa0;font-weight:700\">co-op teamwork<\u002Fspan>.<\u002Fp>\n      <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:22px\">\n        <span style=\"display:inline-flex;gap:8px;align-items:center;padding:8px 13px;background:#0e0e16;border:1px solid rgba(255,255,255,.08);border-radius:9px;font-size:12.5px;font-weight:600;color:#c3c3d4\"><span style=\"width:8px;height:8px;border-radius:50%;background:#4dffa0\"><\u002Fspan>1–2 players<\u002Fspan>\n        <span style=\"display:inline-flex;gap:8px;align-items:center;padding:8px 13px;background:#0e0e16;border:1px solid rgba(255,255,255,.08);border-radius:9px;font-size:12.5px;font-weight:600;color:#c3c3d4\"><span style=\"width:8px;height:8px;border-radius:50%;background:#35d6ff\"><\u002Fspan>Twin-stick + hookshot<\u002Fspan>\n        <span style=\"display:inline-flex;gap:8px;align-items:center;padding:8px 13px;background:#0e0e16;border:1px solid rgba(255,255,255,.08);border-radius:9px;font-size:12.5px;font-weight:600;color:#c3c3d4\"><span style=\"width:8px;height:8px;border-radius:50%;background:#ffa53d\"><\u002Fspan>Momentum matters<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- ============ CONTROLS ============ -->\n    <section id=\"controls\" data-screen-label=\"Controls\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">01<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">Controls at a glance<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#8a8a9c,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:680px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 24px\">STRANDEAD is built for a controller — the <b style=\"color:#e9e9f2\">left stick moves you<\u002Fb> (it also aims your melee), and the <b style=\"color:#e9e9f2\">right stick <em>is<\u002Fem> the hookshot<\u002Fb>. Guns auto-aim toward the nearest enemy in front of you, so you rarely aim manually. Keyboard &amp; mouse is fully supported; on M/KB the mouse aims both your gun and your hook.<\u002Fp>\n\n      <sc-if value=\"{{ isGamepad }}\" hint-placeholder-val=\"{{ true }}\">\n      <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 24px;margin-bottom:16px\">\n        <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#35d6ff;margin-bottom:16px\">▸ GAMEPAD<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px 26px\">\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 8px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">L stick<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Move / face<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Walk, and set the direction your melee swings.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:26px;padding:0 8px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#08080c;background:#b57bff;border-radius:7px\">R stick<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Hookshot<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Push it to fire the cable + steer it mid-flight.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\">{{ gPrimaryEl }}<div><div style=\"font-weight:700;font-size:14px\">Primary attack<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Your melee weapon — the blade.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\">{{ gSecondaryEl }}<div><div style=\"font-weight:700;font-size:14px\">Secondary attack<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Your gun.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\">{{ gDashEl }}<div><div style=\"font-weight:700;font-size:14px\">Dash / interact<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Dodge-dash. Near a chest or downed ally it interacts instead.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\">{{ gCancelEl }}<div><div style=\"font-weight:700;font-size:14px\">Cancel / release<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Let go of a hook, back out of menus, leave a loot drop.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;height:26px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">{{ lFocus }}<\u002Fspan><div><div style=\"font-weight:700;font-size:14px;color:#ffa53d\">Focus (the modifier)<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Hold for precision. Changes what dash, fire, and the hook do — see section 03.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;height:26px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">{{ lRacer }}<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Sprint / Racer<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Tap-hold to sprint; hold longer to drop into high-speed Racer mode.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;height:26px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">{{ lA1 }}<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Ability 1<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Your left equipped ability (grenade, blink, heal…).<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 10px;height:26px;font-family:'Chakra Petch';font-weight:700;font-size:12px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">{{ lA2 }}<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Ability 2<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Your right equipped ability.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:4px 8px;height:26px;font-family:'Chakra Petch';font-weight:700;font-size:11px;color:#e9e9f2;background:#1a1a26;border:1px solid rgba(255,255,255,.14);border-radius:7px\">D-pad ↓<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Build mode<\u002Fdiv><div style=\"font-size:12.5px;color:#9a9ab0;line-height:1.45\">Enter/exit building. Bumpers cycle the piece; hold to place.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ isKbm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 24px\">\n        <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#35d6ff;margin-bottom:16px\">▸ KEYBOARD &amp; MOUSE<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px 26px\">\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">WASD<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Move / face<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">Mouse<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Aim gun + hook<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">LMB<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Primary (melee)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">RMB/F<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Secondary (gun)<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">MMB<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Fire / commit hook<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">Space<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Dash / interact<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">C / Tab<\u002Fspan><div><div style=\"font-weight:700;font-size:14px;color:#ffa53d\">Focus<\u002Fdiv><div style=\"font-size:12px;color:#9a9ab0;line-height:1.4\">C = focus-move &amp; hook modifier · Tab = focus-fire<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">R<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Sprint / Racer<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">E / Q<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Ability 1 / 2<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:13px;align-items:flex-start\"><span style=\"flex:0 0 auto;font-family:'Silkscreen';font-size:10px;color:#08080c;background:#e9e9f2;border-radius:5px;padding:8px 9px;box-shadow:0 2px 0 #6a6a80\">B<\u002Fspan><div><div style=\"font-weight:700;font-size:14px\">Cancel / release<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsection>\n\n        <!-- ============ MOVEMENT ============ -->\n    <section id=\"movement\" data-screen-label=\"Movement\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">02<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">Movement basics<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#35d6ff,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:680px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 24px\">Movement has <b style=\"color:#e9e9f2\">weight<\u002Fb>. You glide a little when you let go of the stick, and hard reversals cost you speed — so plan your direction instead of mashing. The dash is your lifeline, but it's a <b style=\"color:#35d6ff\">committed dodge<\u002Fb>, not a teleport.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #35d6ff;border-radius:14px;padding:20px\">\n          <div style=\"font-weight:800;font-size:16px;margin-bottom:6px\">Walk &amp; weight<\u002Fdiv>\n          <p style=\"font-size:13px;color:#a2a2b6;line-height:1.55;margin:0 0 12px\">You accelerate up to speed and coast to a stop. Whipping the stick back the way you came brakes you — smooth arcs keep momentum.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#7fe4ff;background:rgba(53,214,255,.1);border:1px solid rgba(53,214,255,.25);border-radius:5px;padding:5px 7px\">GLIDE TAIL<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#7fe4ff;background:rgba(53,214,255,.1);border:1px solid rgba(53,214,255,.25);border-radius:5px;padding:5px 7px\">PIVOT COST<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #ffa53d;border-radius:14px;padding:20px\">\n          <div style=\"font-weight:800;font-size:16px;margin-bottom:6px\">Focus-walk <span style=\"font-size:11px;color:#ffa53d;font-weight:700\">(hold {{ lFocus }})<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:#a2a2b6;line-height:1.55;margin:0 0 12px\">Slows you to a careful creep for lining up shots and threading gaps. Full details in the Focus section.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#ffc98a;background:rgba(255,165,61,.1);border:1px solid rgba(255,165,61,.25);border-radius:5px;padding:5px 7px\">45% SPEED<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #35d6ff;border-radius:14px;padding:20px\">\n          <div style=\"font-weight:800;font-size:16px;margin-bottom:6px\">Dash <span style=\"font-size:11px;color:#35d6ff;font-weight:700\">({{ tD }} / Space)<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:#a2a2b6;line-height:1.55;margin:0 0 12px\">A short, snappy burst. You're <b style=\"color:#e9e9f2\">invulnerable only through the middle<\u002Fb> of it — the start-up and landing can still be hit, so time it to pass <em>through<\u002Fem> the danger, not away from it.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#7fe4ff;background:rgba(53,214,255,.1);border:1px solid rgba(53,214,255,.25);border-radius:5px;padding:5px 7px\">I-FRAMES MID-DASH<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#7fe4ff;background:rgba(53,214,255,.1);border:1px solid rgba(53,214,255,.25);border-radius:5px;padding:5px 7px\">0.42s COOLDOWN<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#7fe4ff;background:rgba(53,214,255,.1);border:1px solid rgba(53,214,255,.25);border-radius:5px;padding:5px 7px\">INPUT-BUFFERED<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:12px;align-items:flex-start;margin-top:18px;background:rgba(53,214,255,.05);border:1px solid rgba(53,214,255,.22);border-radius:12px;padding:15px 18px\">\n        <span style=\"font-size:18px;line-height:1.2\">◈<\u002Fspan>\n        <p style=\"margin:0;font-size:13.5px;color:#c3c3d4;line-height:1.55\"><b style=\"color:#35d6ff\">Buffer tip:<\u002Fb> a dash pressed a hair early (mid-dash or during a stagger) is remembered for a moment and fires the instant it's legal. Don't hammer it — one clean press lands.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ MOVEMENT TECH ============ -->\n    <section id=\"movetech\" data-screen-label=\"Movement Tech\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">02·B<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">Movement tech<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#35d6ff,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:700px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 26px\">The dash is the root of a whole toolkit. These all layer onto the same button — the difference is <b style=\"color:#e9e9f2\">what you're doing when you press it<\u002Fb>: standing still, already dashing, moving fast, holding Focus, or racing.<\u002Fp>\n\n      <!-- DASH TECH -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#35d6ff;margin:6px 0 14px\">▸ DASH TECH<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-bottom:30px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Chain Dash<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">{{ tD }} → {{ tD }}<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Right after a clean dash, a short window lets you dash <b style=\"color:#e9e9f2\">again<\u002Fb> ignoring cooldown — up to 3 links, each a touch farther. Cross the arena in a blink.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Charge Dash<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">HOLD {{ tD }}<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hold the dash ~0.3s to charge, then release into a <b style=\"color:#e9e9f2\">longer, armored lunge<\u002Fb> that ends in a small shockwave. Great for opening a fight.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Roll<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">{{ tD }} , {{ tD }}<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Double-tap dash for a low, grounded roll — a different dodge shape for tight spaces.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Tech-Cancel<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">{{ tD }} @ SPEED<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Tap dash while you're already moving fast (e.g. after a knockback) for a quick recovery roll with i-frames — turn a shove into a dodge.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Air Time<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">DASH → WALL<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Dash into a wall or ledge and you briefly hop <b style=\"color:#e9e9f2\">airborne<\u002Fb>, gaining extra invulnerable frames.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Hover<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">POST-DASH<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">A brief grace right after a dash ends where you stay slightly airborne and protected — the dodge lasts a touch longer than it looks.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Wall Bounce<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">DASH @ WALL<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hit a wall while dashing fast and you <b style=\"color:#e9e9f2\">ricochet sideways<\u002Fb> instead of stopping dead, keeping your speed.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Vault<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">DASH → OBSTACLE<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Dash into a <b style=\"color:#e9e9f2\">low crate<\u002Fb> or a <b style=\"color:#e9e9f2\">stunned enemy<\u002Fb> and you hop clean over it — use downed foes as stepping stones.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- FOCUS TECH -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#ffa53d;margin:6px 0 14px\">▸ FOCUS TECH &nbsp;<span style=\"color:#5c5c72\">(hold {{ lFocus }} — see section 03)<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-bottom:30px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Quickstep<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ffa53d;border-radius:4px;padding:4px 6px\">{{ lFocus }} + {{ tD }}<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">A tight repositioning hop — steps away from where you're aiming (or along your movement) with i-frames. The precise micro-dodge.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Parry-Step<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ffa53d;border-radius:4px;padding:4px 6px\">{{ lFocus }} + {{ tD }} → FOE<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Quickstep <b style=\"color:#e9e9f2\">toward an enemy that's winding up<\u002Fb> and you <b style=\"color:#e9e9f2\">cancel its attack<\u002Fb>, stun it, gain i-frames, and earn <span style=\"color:#60ffff;font-weight:700\">+FLOW<\u002Fspan>. The aggressive dodge.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Slide<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ffa53d;border-radius:4px;padding:4px 6px\">{{ lFocus }} @ SPEED<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hold Focus while moving fast to drop into a friction <b style=\"color:#e9e9f2\">glide<\u002Fb> with brief i-frames — slide under fire and keep going.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- SPEED & RACER -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#35d6ff;margin:6px 0 14px\">▸ SPEED &amp; RACER &nbsp;<span style=\"color:#5c5c72\">({{ lRacer }})<\u002Fspan><\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-bottom:30px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Sprint<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">HOLD {{ lRacer }}<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">On foot, a quick hold of R2 with movement runs you faster from a <b style=\"color:#e9e9f2\">stamina meter<\u002Fb> that drains and refills. Reposition between waves.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Racer mode<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">HOLD {{ lRacer }}+<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hold R2 a beat longer to drop into <b style=\"color:#e9e9f2\">Racer<\u002Fb> — a high-speed drive that ramps up and coasts when you let go. Ram enemies at speed to bowl them over.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Racer Dash-Exit<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#35d6ff;border-radius:4px;padding:4px 6px\">{{ tD }} WHILE RACING<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Tap dash while racing to <b style=\"color:#e9e9f2\">bail out into a normal dash<\u002Fb>, carrying some of your speed into the dodge.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Ground Pound<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ffa53d;border-radius:4px;padding:4px 6px\">{{ lFocus }} + {{ tD }} RACING<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Focus + dash out of a race to <b style=\"color:#e9e9f2\">slam down<\u002Fb> into a damaging shockwave that knocks the crowd back.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Drift Brake<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ffa53d;border-radius:4px;padding:4px 6px\">{{ lFocus }} RACING<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hold Focus while racing to <b style=\"color:#e9e9f2\">turn sharper<\u002Fb> — it trades grip for a tighter corner. Pair it with a hook swing for hairpins.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- TERRAIN & IMPACT -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#4dffa0;margin:6px 0 14px\">▸ TERRAIN &amp; IMPACT<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Footing<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">The ground affects you: <b style=\"color:#35d6ff\">slick<\u002Fb> edges near water speed you up but reduce grip; <b style=\"color:#ffa53d\">sticky<\u002Fb> pools slow you down. Read the floor.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Momentum Melee<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#4dffa0;border-radius:4px;padding:4px 6px\">+35% DMG<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Land a melee hit <b style=\"color:#e9e9f2\">while moving fast<\u002Fb> and it hits harder and knocks back further. Charge in — don't fight flat-footed.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-top:2px solid #4dffa0;border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Co-op Dash Link<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#4dffa0;border-radius:4px;padding:4px 6px\">CO-OP<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Dash close past a teammate and you <b style=\"color:#e9e9f2\">tow them along<\u002Fb>, giving you both i-frames — drag a struggling partner out of a bad spot.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n        <!-- ============ L2 / FOCUS ============ -->\n    <section id=\"focus\" data-screen-label=\"Focus\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">03<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">{{ lFocus }} · <span style=\"color:#ffa53d\">Focus<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#ffa53d,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:720px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 26px\"><b style=\"color:#ffa53d\">Focus is a held modifier, not an action.<\u002Fb> On its own it slows and steadies you; combined with other buttons it unlocks a precise version of almost everything. There is no \"focus mode\" screen — you just hold {{ lFocus }} and the game reads it. On keyboard it's split: <b style=\"color:#e9e9f2\">C<\u002Fb> focuses your movement &amp; hook, <b style=\"color:#e9e9f2\">Tab<\u002Fb> focuses your fire.<\u002Fp>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px\">\n\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(255,165,61,.06),transparent);border:1px solid rgba(255,165,61,.22);border-radius:14px;padding:20px\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(255,165,61,.15);border:1px solid rgba(255,165,61,.35);display:inline-flex;align-items:center;justify-content:center;font-size:15px\">🐢<\u002Fspan><span style=\"font-weight:800;font-size:16px\">Focus-move<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:#b0b0c2;line-height:1.55;margin:0 0 10px\">Hold {{ lFocus }} to slow to a careful <b style=\"color:#e9e9f2\">45% walk<\u002Fb>. Perfect for edging around hazards, lining up a shot, or repositioning without over-shooting in a tight fight.<\u002Fp>\n          <span style=\"font-family:'Silkscreen';font-size:8.5px;color:#ffc98a;background:rgba(255,165,61,.1);border:1px solid rgba(255,165,61,.25);border-radius:5px;padding:5px 7px\">{{ lFocus }} · C<\u002Fspan>\n        <\u002Fdiv>\n\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(255,165,61,.06),transparent);border:1px solid rgba(255,165,61,.22);border-radius:14px;padding:20px\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(255,165,61,.15);border:1px solid rgba(255,165,61,.35);display:inline-flex;align-items:center;justify-content:center;font-size:15px\">🎯<\u002Fspan><span style=\"font-weight:800;font-size:16px\">Focus-fire<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:#b0b0c2;line-height:1.55;margin:0 0 10px\">Shoot while holding Focus and your gun fires <b style=\"color:#e9e9f2\">slower but far steadier<\u002Fb> — recoil and self-knockback drop hard. Use it to place precise shots instead of spraying.<\u002Fp>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#ffc98a;background:rgba(255,165,61,.1);border:1px solid rgba(255,165,61,.25);border-radius:5px;padding:5px 7px\">{{ lFocus }} · TAB<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8.5px;color:#ffc98a;background:rgba(255,165,61,.1);border:1px solid rgba(255,165,61,.25);border-radius:5px;padding:5px 7px\">~⅓ RECOIL<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(255,165,61,.06),transparent);border:1px solid rgba(255,165,61,.22);border-radius:14px;padding:20px\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(255,165,61,.15);border:1px solid rgba(255,165,61,.35);display:inline-flex;align-items:center;justify-content:center;font-size:15px\">💨<\u002Fspan><span style=\"font-weight:800;font-size:16px\">Focus + Dash<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:#b0b0c2;line-height:1.55;margin:0 0 10px\">Turns your dash into a <b style=\"color:#e9e9f2\">Quickstep<\u002Fb> — or a <b style=\"color:#e9e9f2\">Parry-Step<\u002Fb> if you aim it into an enemy that's winding up, cancelling their attack. Hold Focus while sprinting fast to <b style=\"color:#e9e9f2\">Slide<\u002Fb>.<\u002Fp>\n          <span style=\"font-family:'Silkscreen';font-size:8.5px;color:#ffc98a;background:rgba(255,165,61,.1);border:1px solid rgba(255,165,61,.25);border-radius:5px;padding:5px 7px\">SEE 02·B<\u002Fspan>\n        <\u002Fdiv>\n\n        <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(255,165,61,.06),transparent);border:1px solid rgba(255,165,61,.22);border-radius:14px;padding:20px\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(255,165,61,.15);border:1px solid rgba(255,165,61,.35);display:inline-flex;align-items:center;justify-content:center;font-size:15px\">🏍️<\u002Fspan><span style=\"font-weight:800;font-size:16px\">Focus while Racing<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:#b0b0c2;line-height:1.55;margin:0 0 10px\">Holding Focus during a Racer run is the <b style=\"color:#e9e9f2\">Drift Brake<\u002Fb> (sharper turns); Focus + dash is the <b style=\"color:#e9e9f2\">Ground Pound<\u002Fb> slam. Focus is your steering finesse at speed.<\u002Fp>\n          <span style=\"font-family:'Silkscreen';font-size:8.5px;color:#ffc98a;background:rgba(255,165,61,.1);border:1px solid rgba(255,165,61,.25);border-radius:5px;padding:5px 7px\">SEE 02·B<\u002Fspan>\n        <\u002Fdiv>\n\n        <div class=\"sg-card\" style=\"grid-column:1/-1;background:linear-gradient(180deg,rgba(181,123,255,.07),transparent);border:1px solid rgba(181,123,255,.28);border-radius:14px;padding:20px\">\n          <div style=\"display:flex;align-items:center;gap:10px;margin-bottom:8px\"><span style=\"width:30px;height:30px;border-radius:8px;background:rgba(181,123,255,.15);border:1px solid rgba(181,123,255,.4);display:inline-flex;align-items:center;justify-content:center;font-size:15px\">🪢<\u002Fspan><span style=\"font-weight:800;font-size:16px;color:#c9a7ff\">Focus = the Hogtie modifier<\u002Fspan><\u002Fdiv>\n          <p style=\"font-size:13px;color:#b0b0c2;line-height:1.55;margin:0;max-width:760px\">This is the big one. <b style=\"color:#e9e9f2\">Hold {{ lFocus }} as your hookshot lands on an enemy<\u002Fb> and instead of reeling that one mob in, the cable instantly <b style=\"color:#c9a7ff\">hogties it and every enemy nearby<\u002Fb> into a bound knot you can drag around. Without Focus, the same hit reels/spins the mob instead. Full breakdown in <a href=\"#hook\" style=\"color:#c9a7ff;font-weight:700;text-decoration:underline\">The Hookshot →<\u002Fa><\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;gap:12px;align-items:flex-start;margin-top:18px;background:rgba(255,165,61,.05);border:1px solid rgba(255,165,61,.22);border-radius:12px;padding:15px 18px\">\n        <span style=\"font-size:18px\">◈<\u002Fspan>\n        <p style=\"margin:0;font-size:13.5px;color:#c3c3d4;line-height:1.55\"><b style=\"color:#ffa53d\">One button, many verbs.<\u002Fb> Focus never does anything by itself — it always sharpens or re-routes whatever you press next. When in doubt, hold it and experiment.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============ COMBAT ============ -->\n    <section id=\"combat\" data-screen-label=\"Combos and Super\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">04<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">Combos &amp; the <span style=\"color:#ff3d8b\">Break-Switch<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#ff3d8b,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:720px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 24px\">You start with two weapons: a <b style=\"color:#35d6ff\">melee blade<\u002Fb> on Primary ({{ tP }}) and a <b style=\"color:#ffa53d\">sidearm gun<\u002Fb> on Secondary ({{ tS }}). The combat loop is simple to start and deep to master — <b style=\"color:#e9e9f2\">landing hits builds Flow, and Flow lets you cash in a Super by switching weapons at the right moment.<\u002Fb><\u002Fp>\n\n      <!-- Default loadout -->\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:26px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-left:3px solid #35d6ff;border-radius:13px;padding:18px\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">{{ gPrimaryEl }}<span style=\"font-weight:800;font-size:15px\">Primary — Scrap Cutter<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">The starter blade. Fast, momentum-hungry, chains a 3-hit combo. Its Super is a slow-mo dash-flurry.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-left:3px solid #ffa53d;border-radius:13px;padding:18px\"><div style=\"display:flex;align-items:center;gap:10px;margin-bottom:6px\">{{ gSecondaryEl }}<span style=\"font-weight:800;font-size:15px\">Secondary — Sidearm<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">A reliable gun that auto-aims at the nearest enemy in front of you. Its Super is a rapid burst volley.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- Combo flow diagram -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#ff3d8b;margin:8px 0 14px\">▸ THE MELEE COMBO<\u002Fdiv>\n      <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:24px;margin-bottom:14px\">\n        <div style=\"display:flex;align-items:stretch;gap:10px;flex-wrap:wrap\">\n          <div style=\"flex:1 1 130px;min-width:120px;background:#12121c;border:1px solid rgba(53,214,255,.25);border-radius:11px;padding:15px;text-align:center\"><div style=\"font-family:'Silkscreen';font-size:9px;color:#7fe4ff;margin-bottom:6px\">HIT 1<\u002Fdiv><div style=\"font-weight:800;font-size:15px\">Light<\u002Fdiv><div style=\"font-size:11px;color:#8a8a9c;margin-top:4px\">×0.88 dmg<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;color:#4a4a5e;font-size:20px\">→<\u002Fdiv>\n          <div style=\"flex:1 1 130px;min-width:120px;background:#12121c;border:1px solid rgba(53,214,255,.25);border-radius:11px;padding:15px;text-align:center\"><div style=\"font-family:'Silkscreen';font-size:9px;color:#7fe4ff;margin-bottom:6px\">HIT 2<\u002Fdiv><div style=\"font-weight:800;font-size:15px\">Light<\u002Fdiv><div style=\"font-size:11px;color:#8a8a9c;margin-top:4px\">×1.0 dmg<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;align-items:center;color:#4a4a5e;font-size:20px\">→<\u002Fdiv>\n          <div style=\"flex:1 1 130px;min-width:120px;background:#161020;border:1px solid rgba(255,61,139,.35);border-radius:11px;padding:15px;text-align:center\"><div style=\"font-family:'Silkscreen';font-size:9px;color:#ff85b6;margin-bottom:6px\">HIT 3<\u002Fdiv><div style=\"font-weight:800;font-size:15px\">Heavy<\u002Fdiv><div style=\"font-size:11px;color:#8a8a9c;margin-top:4px\">×1.25 dmg<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px\">\n          <div style=\"background:rgba(53,214,255,.05);border:1px dashed rgba(53,214,255,.3);border-radius:10px;padding:14px\"><div style=\"font-weight:700;font-size:13.5px;color:#7fe4ff;margin-bottom:4px\">Press {{ tP }} again → Crescendo Cut<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">A deliberate 4th press right after Hit 3 fires a heavy <b style=\"color:#e9e9f2\">radial slam<\u002Fb> that clears space around you and keeps your Flow going.<\u002Fp><\u002Fdiv>\n          <div style=\"background:rgba(255,61,139,.05);border:1px dashed rgba(255,61,139,.35);border-radius:10px;padding:14px\"><div style=\"font-weight:700;font-size:13.5px;color:#ff85b6;margin-bottom:4px\">Press {{ tS }} → Break-Switch Super<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">If Flow is armed, switching to the <b style=\"color:#e9e9f2\">other weapon<\u002Fb> spends it on a Super. This is the core of the whole system ↓<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:12px;color:#8a8a9c;line-height:1.5;margin:14px 0 0\">Melee auto-assists toward nearby foes then snaps to a facing direction, and each hit lunges you forward — you don't need pixel-perfect aim, just rhythm. Dashing cancels the combo cleanly.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- FLOW meter -->\n      <div class=\"sg-card\" style=\"background:linear-gradient(180deg,rgba(255,61,139,.06),transparent);border:1px solid rgba(255,61,139,.24);border-radius:16px;padding:22px 24px;margin-bottom:14px\">\n        <div style=\"font-weight:800;font-size:17px;margin-bottom:8px;color:#ff85b6\">So what <em>is<\u002Fem> Flow?<\u002Fdiv>\n        <p style=\"font-size:13.5px;color:#b7b7c8;line-height:1.6;margin:0 0 12px;max-width:780px\">Flow is your <b style=\"color:#e9e9f2\">skill momentum<\u002Fb> — a hidden meter that rises every time you do something aggressive and clean, and falls when you play sloppy. It isn't spent on abilities; it's the fuel for your <b style=\"color:#ff3d8b\">Break-Switch Supers<\u002Fb> and the game's way of scoring your rhythm.<\u002Fp>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px\">\n          <div style=\"background:#12121c;border:1px solid rgba(77,255,160,.22);border-radius:11px;padding:14px\"><div style=\"font-weight:700;font-size:13.5px;color:#7dffbf;margin-bottom:5px\">Build it by<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">Landing hits, and skill moves: parries, counter-hooks, throws, grazes, deflects, perfect dodges. Anything tagged <span style=\"color:#60ffff;font-weight:700\">+FLOW<\u002Fspan>.<\u002Fp><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(255,61,139,.28);border-radius:11px;padding:14px\"><div style=\"font-weight:700;font-size:13.5px;color:#ff85b6;margin-bottom:5px\">Spend it on<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">A weapon-switch <b style=\"color:#e9e9f2\">Super<\u002Fb>. The more Flow (higher tier), the stronger the Super — and a Perfect switch empowers it further.<\u002Fp><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(255,77,77,.28);border-radius:11px;padding:14px\"><div style=\"font-weight:700;font-size:13.5px;color:#ff6a5a;margin-bottom:5px\">Lose it by<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">Taking a hit, overheating a weapon, or whiffing an attack. Stay aggressive <em>and<\u002Fem> untouched to keep it climbing.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#ff3d8b;margin:22px 0 14px\">▸ FLOW &amp; THE SUPER SWITCH<\u002Fdiv>\n      <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:24px;margin-bottom:14px\">\n        <p style=\"font-size:13.5px;color:#b0b0c2;line-height:1.6;margin:0 0 16px\">Every hit you land — with <b style=\"color:#e9e9f2\">either weapon<\u002Fb> — feeds one shared <b style=\"color:#ff3d8b\">Flow<\u002Fb> meter. Weaving blade and gun together keeps the <em>same<\u002Fem> chain building. As it fills it passes three tiers:<\u002Fp>\n        <div style=\"position:relative;height:16px;border-radius:8px;background:#161620;overflow:hidden;margin-bottom:6px\"><div style=\"position:absolute;inset:0;background:linear-gradient(90deg,#ff3d8b,#ffa53d,#35d6ff)\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"display:flex;justify-content:space-between;font-size:11px;color:#9a9ab0;margin-bottom:18px\"><span><b style=\"color:#e9e9f2\">3 hits<\u002Fb> · Tier 1<\u002Fspan><span><b style=\"color:#e9e9f2\">5 hits<\u002Fb> · Tier 2<\u002Fspan><span><b style=\"color:#e9e9f2\">7 hits<\u002Fb> · Tier 3<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px\">\n          <div style=\"background:#12121c;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:16px\"><div style=\"font-weight:800;font-size:14px;margin-bottom:6px\">1 · A cue lights up<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">Once armed, a bright ring + prompt flashes on you pointing at the <b style=\"color:#e9e9f2\">other<\u002Fb> weapon slot. That's your window.<\u002Fp><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:16px\"><div style=\"font-weight:800;font-size:14px;margin-bottom:6px\">2 · Switch weapons<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">Press the <b style=\"color:#e9e9f2\">opposite<\u002Fb> weapon within ~1.1s to spend the Flow on that weapon's <b style=\"color:#ff3d8b\">Super<\u002Fb>. Higher tier = stronger.<\u002Fp><\u002Fdiv>\n          <div style=\"background:#161020;border:1px solid rgba(255,61,139,.35);border-radius:11px;padding:16px\"><div style=\"font-weight:800;font-size:14px;margin-bottom:6px;color:#ff85b6\">3 · PERFECT! timing<\u002Fdiv><p style=\"font-size:12px;color:#a2a2b6;line-height:1.5;margin:0\">Switch in the <b style=\"color:#e9e9f2\">first sliver<\u002Fb> of the window for a <b style=\"color:#ff85b6\">Perfect<\u002Fb> — bonus tier, +25% damage, and a louder hit.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-bottom:14px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-left:3px solid #35d6ff;border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:6px\">Melee Super — Blade Flurry<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Switching <b style=\"color:#e9e9f2\">into<\u002Fb> the blade triggers a slow-mo chain that <b style=\"color:#e9e9f2\">dash-strikes between nearby enemies<\u002Fb> automatically — several hits, then a big finisher. Each weapon family has its own flavour.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-left:3px solid #ffa53d;border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:6px\">Gun Super — Burst<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Switching into the sidearm unloads an empowered volley in your aim direction. Ranged families each get a distinct special (spread fan, rail lance, cluster bomblets…).<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- extra combat tech -->\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Brawl-Cancel weave<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ff3d8b;border-radius:4px;padding:4px 6px\">{{ tS }} MID-SWING<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Fire the gun <b style=\"color:#e9e9f2\">during<\u002Fb> a blade swing to cancel its recovery into a widened point-blank blast — and it keeps the enemy in melee range instead of shoving them off.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Dash-opener bonus<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ff3d8b;border-radius:4px;padding:4px 6px\">DASH → HIT<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Attacking right out of a dash counts as an opener — some weapons and upgrades hit harder in that brief window. Reward for entering aggressively.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Losing Flow<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ff4d4d;border-radius:4px;padding:4px 6px\">FLOW LOST!<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Getting hit — or letting a heat weapon overheat — <b style=\"color:#e9e9f2\">drains your chain<\u002Fb>. And if a swing whiffs entirely, the meter resets. Keep connecting, keep dodging.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n        <!-- ============ HOOKSHOT ============ -->\n    <section id=\"hook\" data-screen-label=\"Hookshot\" style=\"padding:34px 0;scroll-margin-top:18px\">\n      <div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:6px\">\n        <span style=\"font-family:'Silkscreen';font-size:12px;color:#5c5c72\">05<\u002Fspan>\n        <h2 style=\"font-family:'Chakra Petch';font-weight:700;font-size:clamp(26px,4vw,38px);margin:0;letter-spacing:.5px\">The <span style=\"color:#b57bff\">Hookshot<\u002Fspan><\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"height:2px;background:linear-gradient(90deg,#b57bff,transparent);margin:0 0 22px\"><\u002Fdiv>\n      <p style=\"max-width:720px;color:#a9a9bc;font-size:15px;line-height:1.6;margin:0 0 24px\">The right stick <b style=\"color:#b57bff\">is<\u002Fb> the hook. Push it to fire the cable instantly along your aim; it <b style=\"color:#e9e9f2\">curves toward wherever you keep aiming<\u002Fb> as it flies, and grabs the first thing it touches. What happens next depends on <b style=\"color:#e9e9f2\">what you hit<\u002Fb> — and whether you're holding Focus. Press <span style=\"color:#ff6a6a;font-weight:700\">{{ tC }}<\u002Fspan> to let go. (On M/KB: mouse aims, middle-mouse fires.)<\u002Fp>\n\n      <!-- state map -->\n      <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:22px 22px 24px;margin-bottom:26px\">\n        <div style=\"text-align:center;margin-bottom:14px\"><span style=\"display:inline-block;font-family:'Silkscreen';font-size:11px;letter-spacing:1px;color:#08080c;background:#b57bff;border-radius:7px;padding:8px 14px\">FIRE CABLE →<\u002Fspan><\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px\">\n          <div style=\"background:#12121c;border:1px solid rgba(255,61,139,.28);border-radius:11px;padding:14px\"><div style=\"font-weight:800;font-size:13.5px;color:#ff85b6;margin-bottom:5px\">Hit a mob<\u002Fdiv><div style=\"font-size:11.5px;color:#9a9ab0;line-height:1.5\">→ Reel it in → whirls into a <b style=\"color:#e9e9f2\">Spin<\u002Fb> → flick to <b style=\"color:#e9e9f2\">Throw<\u002Fb><\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(255,165,61,.28);border-radius:11px;padding:14px\"><div style=\"font-weight:800;font-size:13.5px;color:#ffc98a;margin-bottom:5px\">Hit a mob + hold {{ lFocus }}<\u002Fdiv><div style=\"font-size:11.5px;color:#9a9ab0;line-height:1.5\">→ <b style=\"color:#e9e9f2\">Hogtie<\u002Fb> it + nearby foes into a draggable knot<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(53,214,255,.28);border-radius:11px;padding:14px\"><div style=\"font-weight:800;font-size:13.5px;color:#7fe4ff;margin-bottom:5px\">Hit a tree (on foot)<\u002Fdiv><div style=\"font-size:11.5px;color:#9a9ab0;line-height:1.5\">→ <b style=\"color:#e9e9f2\">Self-pull<\u002Fb> to it → re-press to <b style=\"color:#e9e9f2\">Foot-Swing<\u002Fb><\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(53,214,255,.28);border-radius:11px;padding:14px\"><div style=\"font-weight:800;font-size:13.5px;color:#7fe4ff;margin-bottom:5px\">Hit a tree (racing)<\u002Fdiv><div style=\"font-size:11.5px;color:#9a9ab0;line-height:1.5\">→ Pendulum <b style=\"color:#e9e9f2\">Swing<\u002Fb> the corner → <b style=\"color:#e9e9f2\">Slingshot<\u002Fb> out<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(77,255,160,.28);border-radius:11px;padding:14px\"><div style=\"font-weight:800;font-size:13.5px;color:#8dffc4;margin-bottom:5px\">Hit a downed ally / chest<\u002Fdiv><div style=\"font-size:11.5px;color:#9a9ab0;line-height:1.5\">→ <b style=\"color:#e9e9f2\">Reel them to safety<\u002Fb> / drag loot to you<\u002Fdiv><\u002Fdiv>\n          <div style=\"background:#12121c;border:1px solid rgba(255,255,255,.12);border-radius:11px;padding:14px\"><div style=\"font-weight:800;font-size:13.5px;color:#c9c9d8;margin-bottom:5px\">Hit a hostile shot<\u002Fdiv><div style=\"font-size:11.5px;color:#9a9ab0;line-height:1.5\">→ <b style=\"color:#e9e9f2\">Redirect<\u002Fb> it back at the enemy<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ON A MOB -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#b57bff;margin:8px 0 14px\">▸ AGAINST ENEMIES<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-bottom:30px\">\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Reel &amp; combo<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">A normal grab yanks the enemy to just <b style=\"color:#e9e9f2\">in front of you<\u002Fb>, stunned and set up for an instant combo. <b style=\"color:#e9e9f2\">Bosses &amp; heavies<\u002Fb> reverse it and pull <em>you<\u002Fem> to them.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Spin Throw<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#b57bff;border-radius:4px;padding:4px 6px\">FLICK R<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">As the mob reels close it <b style=\"color:#e9e9f2\">whirls around you<\u002Fb>, building speed and battering other foes. <b style=\"color:#e9e9f2\">Flick the stick<\u002Fb> to launch it — the closer your flick to its spin direction, the harder it flies. Dead-on = <span style=\"color:#c9a7ff;font-weight:700\">PERFECT THROW!<\u002Fspan><\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,165,61,.3);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px;color:#ffc98a\">Hogtie<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ffa53d;border-radius:4px;padding:4px 6px\">HOLD {{ lFocus }}<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hold Focus as the cable lands and it <b style=\"color:#e9e9f2\">instantly binds that mob + everyone near it<\u002Fb> into a tied knot. Walk around and the whole bundle <b style=\"color:#e9e9f2\">drags behind you<\u002Fb> on a leash — crowd control on a rope.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"font-weight:800;font-size:15px;margin-bottom:7px\">Arrival slam &amp; bowling<\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">When a reeled mob arrives it slams down, and any other enemies packed around the landing get <b style=\"color:#e9e9f2\">bowled outward<\u002Fb>. Big reels double as area knockback.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Counter-Hook<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#4dffa0;border-radius:4px;padding:4px 6px\">+FLOW<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hook an enemy <b style=\"color:#e9e9f2\">mid-telegraph<\u002Fb> and you cancel its attack, stun it, and earn Flow. A ranged parry on a cable.<\u002Fp><\u002Fdiv>\n        <div class=\"sg-card\" style=\"background:#0d0d15;border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:18px\"><div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:7px\"><span style=\"font-weight:800;font-size:15px\">Grapple Finisher<\u002Fspan><span style=\"font-family:'Silkscreen';font-size:8px;color:#08080c;background:#ff4d4d;border-radius:4px;padding:4px 6px\">LOW-HP ELITE<\u002Fspan><\u002Fdiv><p style=\"font-size:12.5px;color:#a2a2b6;line-height:1.5;margin:0\">Hook a wounded <b style=\"color:#e9e9f2\">elite<\u002Fb> and the cable executes it outright — a clean way to end a dangerous unit.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- MOBILITY -->\n      <div style=\"font-family:'Silkscreen';font-size:10px;letter-spacing:1.5px;color:#35d6ff;margin:8px 0 14px\">▸ MOBILITY (TREES &amp; RACING)<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px;margin-bottom:30px\">\n        <div class=
