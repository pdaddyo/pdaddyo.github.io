<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Left Hand Voicings</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#000; --paper:#fff; --yellow:#FFF200; --grey:#6b6b6b; --rule:#dcdcdc; --focus:#0057ff; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--paper); color:var(--ink); font-family:'Archivo',Helvetica,Arial,sans-serif; }
  body { padding: 20px 20px 28px; }
  .anton { font-family:'Anton',Impact,'Arial Narrow',sans-serif; font-weight:400; }

  h1 { font-family:'Anton',Impact,sans-serif; font-weight:400; font-size:clamp(30px,6vw,54px); line-height:.9; letter-spacing:-.01em; margin:0; text-transform:uppercase; }
  .kicker { font-family:'Anton',Impact,sans-serif; letter-spacing:.42em; font-size:11px; margin:0 0 2px 2px; text-transform:uppercase; }
  .band { height:10px; background:var(--yellow); margin:14px 0 0; }

  /* tabs */
  .tabs { display:flex; gap:0; margin:0 0 18px; border-bottom:4px solid var(--ink); }
  .tabs button { flex:1; appearance:none; border:0; background:none; cursor:pointer; font-family:'Anton',Impact,sans-serif; font-size:clamp(16px,3.4vw,22px); padding:12px 6px 10px; color:var(--grey); text-transform:uppercase; letter-spacing:.04em; touch-action:manipulation; }
  .tabs button[aria-selected="true"] { background:var(--ink); color:var(--paper); }
  .tabs button:focus-visible { outline:3px solid var(--focus); outline-offset:-3px; }

  .acc { font-family:'Archivo','Segoe UI Symbol',sans-serif; font-weight:600; font-size:.58em; vertical-align:.38em; margin:0 -.06em 0 -.14em; letter-spacing:0; }

  /* ---- dropdowns ---- */
  .controls { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .dd { position:relative; }
  .dd-btn { touch-action:manipulation; user-select:none; appearance:none; border:0; background:var(--paper); cursor:pointer; color:var(--ink);
    font-family:'Anton',Impact,sans-serif; font-size:clamp(32px,5.4vw,56px); line-height:1; padding:6px 14px 6px 8px; display:flex; align-items:center; gap:14px; }
  .dd-btn::after { content:''; width:0; height:0; border-left:11px solid transparent; border-right:11px solid transparent; border-top:14px solid var(--ink); transition:transform .12s; }
  .dd-btn:hover, .dd[aria-expanded="true"] .dd-btn { background:var(--ink); color:var(--paper); }
  .dd-btn:hover::after, .dd[aria-expanded="true"] .dd-btn::after { border-top-color:var(--yellow); }
  .dd[aria-expanded="true"] .dd-btn::after { transform:rotate(180deg); }
  .dd-list { position:absolute; top:100%; left:0; z-index:20; margin:0; padding:0; list-style:none;
    background:var(--paper); border:4px solid var(--ink); min-width:100%;
    max-width:calc(100vw - 56px); max-height:calc(100vh - 110px); overflow:auto; -webkit-overflow-scrolling:touch;
    display:none; grid-template-columns:repeat(var(--cols,1),auto); gap:2px; background-color:var(--yellow); }
  .dd[aria-expanded="true"] .dd-list { display:grid; }
  .dd-list li { font-family:'Anton',Impact,sans-serif; font-size:26px; line-height:1; padding:20px 26px 18px 22px; cursor:pointer; white-space:nowrap; background:var(--paper); text-align:center; min-width:64px; touch-action:manipulation; user-select:none; }
  .dd-list li:hover, .dd-list li.focus { background:var(--yellow); }
  .dd-list li[aria-selected="true"] { background:var(--ink); color:var(--paper); }
  .dd-btn:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { .dd-btn::after { transition:none; } }

  /* ---- voicing blocks ---- */
  .layout { max-width:620px; }
  .voicing { padding:16px 0 24px; border-top:6px solid var(--yellow); }
  .vhead { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .notes { font-family:'Anton',Impact,sans-serif; font-size:clamp(28px,7.6vw,56px); line-height:1; letter-spacing:.02em; white-space:nowrap; flex:1 1 auto; min-width:0; }
  .vmeta { text-align:right; flex:0 0 auto; display:flex; align-items:flex-end; gap:10px; }
  .formula { font-family:'Anton',Impact,sans-serif; font-size:24px; line-height:1; letter-spacing:.04em; color:var(--grey); white-space:nowrap; }
  .vsub { font-size:11px; color:var(--grey); font-weight:600; white-space:nowrap; margin-top:4px; }
  .addbtn { appearance:none; border:0; background:var(--ink); color:var(--yellow); font-family:'Anton',Impact,sans-serif; font-size:22px; line-height:1;
    width:38px; height:38px; cursor:pointer; touch-action:manipulation; flex:0 0 auto; }
  .addbtn:hover { background:var(--yellow); color:var(--ink); }
  .addbtn:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
  svg.kbd { width:100%; height:auto; display:block; }
  .kbd .wk { fill:#fff; stroke:#000; stroke-width:1.5; }
  .kbd .bk { fill:#111; stroke:#000; }
  .kbd .wk.on { fill:var(--yellow); }
  .kbd .bk.on { fill:var(--yellow); stroke:#000; }
  .kbd text { font-family:'Archivo',sans-serif; font-weight:600; font-size:12px; text-anchor:middle; }

  /* ---- list views ---- */
  .listbar { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
  .listbar h2 { font-family:'Anton',Impact,sans-serif; font-weight:400; font-size:clamp(22px,4.6vw,34px); margin:0; text-transform:uppercase; line-height:1; }
  .listbar .count { font-size:12px; color:var(--grey); font-weight:600; }
  .listbar .spacer { flex:1; }
  .txtbtn { appearance:none; border:0; background:none; cursor:pointer; font:inherit; font-weight:700; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink); border-bottom:3px solid var(--yellow); padding:2px 0; touch-action:manipulation; }
  .txtbtn:hover { border-bottom-color:var(--ink); }

  .fitwrap { overflow:hidden; }
  .grid { display:grid; grid-template-columns:repeat(var(--cols,1),minmax(0,1fr)); gap:6px; align-content:start; }
  .card { border:3px solid var(--ink); background:var(--paper); padding:var(--pad,7px) var(--pad,7px) calc(var(--pad,7px) - 2px);
    position:relative; cursor:grab; touch-action:none; user-select:none; }
  .card.dragging { opacity:.35; }
  .card.ghost { position:fixed; width:var(--cw,150px); z-index:60; pointer-events:none; cursor:grabbing; box-shadow:0 8px 22px rgba(0,0,0,.28); opacity:1; }
  .card .sym { font-family:'Anton',Impact,sans-serif; font-size:calc(var(--fs,150px)*.155); line-height:1; padding-right:16px; }
  .card .nts { font-family:'Anton',Impact,sans-serif; font-size:calc(var(--fs,150px)*.125); line-height:1; margin-top:3px; letter-spacing:.01em; white-space:nowrap; overflow:hidden; }
  .card .ab { position:absolute; top:0; right:0; background:var(--ink); color:var(--yellow); font-family:'Anton',Impact,sans-serif; font-size:calc(var(--fs,150px)*.1); line-height:1; padding:3px 5px 2px; }
  .card .rm { position:absolute; bottom:0; right:0; background:var(--yellow); border:0; color:var(--ink); font-family:'Anton',Impact,sans-serif;
    font-size:calc(var(--fs,150px)*.11); line-height:1; padding:3px 6px 2px; cursor:pointer; touch-action:manipulation; }
  .card .rm:hover { background:var(--ink); color:var(--yellow); }
  .card .mk { margin-top:4px; }
  .card .mk svg { max-width:calc(var(--fs,150px)*1.8); }
  .empty { color:var(--grey); font-size:14px; max-width:34em; line-height:1.5; }

  /* ---- search ---- */
  .searchwrap { position:relative; max-width:620px; margin-bottom:14px; }
  #q { width:100%; padding-right:52px !important; font-family:'Anton',Impact,sans-serif; font-size:clamp(22px,4.6vw,34px); line-height:1; padding:10px 8px; border:0; border-bottom:6px solid var(--yellow); background:var(--paper); color:var(--ink); }
  #q::placeholder { color:var(--rule); }
  #q:focus { outline:none; border-bottom-color:var(--ink); }
  #qclear { position:absolute; right:0; top:50%; transform:translateY(-60%); appearance:none; border:0; background:none; cursor:pointer;
    font-family:'Anton',Impact,sans-serif; font-size:clamp(22px,4.6vw,32px); line-height:1; color:var(--grey); padding:6px 10px; touch-action:manipulation; }
  #qclear:hover { color:var(--ink); }
  #qclear:focus-visible { outline:3px solid var(--focus); }
  .ac { position:absolute; top:100%; left:0; right:0; z-index:20; background:var(--yellow); border:4px solid var(--ink); border-top:0; max-height:46vh; overflow:auto; display:none; }
  .ac.open { display:block; }
  .ac div { background:var(--paper); padding:12px 14px; font-weight:600; font-size:15px; cursor:pointer; margin-bottom:2px; touch-action:manipulation; }
  .ac div:last-child { margin-bottom:0; }
  .ac div:hover, .ac div.focus { background:var(--yellow); }

  /* ---- toast ---- */
  #toast { position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(140%); z-index:80;
    background:var(--ink); color:var(--paper); display:flex; align-items:center; gap:16px; padding:12px 14px 12px 18px; transition:transform .18s ease; max-width:calc(100vw - 32px); }
  #toast.show { transform:translateX(-50%) translateY(0); }
  #toast span { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toast button { appearance:none; border:0; background:var(--yellow); color:var(--ink); font-family:'Anton',Impact,sans-serif; font-size:16px; padding:7px 12px 6px; cursor:pointer; touch-action:manipulation; }
  @media (prefers-reduced-motion: reduce) { #toast { transition:none; } }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<p class="kicker">Jazz piano</p>
<h1>Left hand voicings</h1>
<div class="band"></div>

<div class="tabs" role="tablist">
  <button role="tab" id="tab-build" aria-selected="true" aria-controls="p-build">Voicings</button>
  <button role="tab" id="tab-song" aria-selected="false" aria-controls="p-song">Song</button>
  <button role="tab" id="tab-find" aria-selected="false" aria-controls="p-find">Search</button>
</div>

<!-- BUILD -->
<section id="p-build" role="tabpanel" aria-labelledby="tab-build">
  <div class="layout">
    <div class="controls">
      <div class="dd" id="roots" aria-expanded="false"></div>
      <div class="dd" id="types" aria-expanded="false"></div>
    </div>
    <div id="out"></div>
  </div>
</section>

<!-- SONG -->
<section id="p-song" role="tabpanel" aria-labelledby="tab-song" hidden>
  <div class="listbar">
    <h2>Song</h2>
    <span class="count" id="song-count"></span>
    <span class="spacer"></span>
    <button class="txtbtn" id="song-clear">Clear all</button>
  </div>
  <div class="fitwrap" id="song-fit"><div class="grid" id="song-grid"></div></div>
  <p class="empty" id="song-empty">Nothing here yet. Build a voicing on the Voicings tab and hit <strong>+</strong> to add it.<br><br>Tap a card to flip between Type&nbsp;A and Type&nbsp;B. Drag to reorder. <strong>×</strong> removes it.</p>
</section>

<!-- FIND -->
<section id="p-find" role="tabpanel" aria-labelledby="tab-find" hidden>
  <div class="searchwrap">
    <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Search 1,456 standards…" aria-label="Search standards">
    <button id="qclear" type="button" aria-label="Clear search and tune" hidden>×</button>
    <div class="ac" id="ac"></div>
  </div>
  <div class="listbar">
    <h2 id="find-title"></h2>
    <span class="count" id="find-count"></span>
    <span class="spacer"></span>
    <button class="txtbtn" id="find-copy" hidden>Send to Song</button>
  </div>
  <div class="fitwrap" id="find-fit"><div class="grid" id="find-grid"></div></div>
  <p class="empty" id="find-empty">Search for a standard to see its changes as left-hand voicings, in the order they appear.</p>
</section>

<div id="toast" role="status" aria-live="polite"><span id="toast-msg"></span><button id="toast-undo" type="button">Undo</button></div>

<script>
// ============ theory ============
const LETTERS = ['C','D','E','F','G','A','B'];
const NAT_PC  = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
const ACC_VAL = { '':0, '#':1, 'b':-1, 'x':2, 'bb':-2 };
const ROOTS = ['C','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B','C#'];
const DEG = {
  '1':[0,0], '3':[2,4], 'b3':[2,3], '5':[4,7], 'b5':[4,6],
  '7':[6,11], 'b7':[6,10], 'bb7':[6,9],
  '9':[1,14], 'b9':[1,13], '#9':[1,15], '13':[5,21], 'b13':[5,20],
};
const TYPES = [
  { id:'maj7', label:'Major 7', sym:'maj7', pdf:'3-7-5-9',    A:['3','5','7','9'],     B:['7','9','3','5'],     show:{A:'3-5-7-9',   B:'7-9-3-5'} },
  { id:'m7',   label:'Minor 7', sym:'m7',   pdf:'3-7-5-9',    A:['b3','5','b7','9'],   B:['b7','9','b3','5'],   show:{A:'3-5-7-9',   B:'7-9-3-5'} },

  { id:'7alt', label:'7alt',    sym:'7alt', pdf:'3-7-#9-♭13', A:['3','b13','b7','#9'], B:['b7','#9','3','b13'], show:{A:'3-♭13-7-#9',B:'7-#9-3-♭13'} },
  { id:'7b9',  label:'7♭9',     sym:'7♭9',  pdf:'3-7-5-♭9',   A:['3','5','b7','b9'],   B:['b7','b9','3','5'],   show:{A:'3-5-7-♭9',  B:'7-♭9-3-5'} },

];
const TYPE_IDX = Object.fromEntries(TYPES.map((t,i)=>[t.id,i]));

function spell(root, deg) {
  const letter = root[0], acc = root.slice(1);
  const [steps, semis] = DEG[deg];
  const newLetter = LETTERS[(LETTERS.indexOf(letter) + steps) % 7];
  const targetPc = ((NAT_PC[letter] + ACC_VAL[acc] + semis) % 12 + 12) % 12;
  let diff = ((targetPc - NAT_PC[newLetter]) % 12 + 12) % 12;
  if (diff > 6) diff -= 12;
  const accs = { 0:'', 1:'#', 2:'x', '-1':'b', '-2':'bb' }[diff] ?? '?';
  return { name: newLetter + accs, pc: targetPc };
}
function buildVoicing(root, degs) {
  const sp = degs.map(d => spell(root, d));
  const notes = [{ ...sp[0], midi: 48 + sp[0].pc }];
  for (let i = 1; i < sp.length; i++) {
    const prev = notes[i-1].midi;
    let m = prev + ((sp[i].pc - (prev % 12) + 12) % 12);
    if (m === prev) m += 12;
    notes.push({ ...sp[i], midi: m });
  }
  return notes;
}
// double accidentals as doubled single glyphs — the Unicode 𝄫/𝄪 have almost no font coverage
const pretty = s => s.replace(/bb/g,'♭♭').replace(/b/g,'♭').replace(/x/g,'♯♯').replace(/#/g,'♯');
const wrapAcc = s => s.replace(/([♭♯])/g, '<span class="acc">$1</span>');
const prettyHTML = s => wrapAcc(pretty(s));

// ============ keyboard ============
const isBlack = m => [1,3,6,8,10].includes(m % 12);
const WOFF = { 0:0, 2:1, 4:2, 5:3, 7:4, 9:5, 11:6 };
const whiteIndex = m => Math.floor(m/12)*7 + WOFF[m % 12];

function keyboardSVG(notes, opts) {
  const o = Object.assign({ pad:3, W:34, H:120, BW:20, BH:74, labels:true }, opts||{});
  const active = new Map(notes.map(n => [n.midi, n.name]));
  let lo = Math.min(...notes.map(n=>n.midi)) - o.pad, hi = Math.max(...notes.map(n=>n.midi)) + o.pad;
  while (isBlack(lo)) lo--;
  while (isBlack(hi)) hi++;
  const startWI = whiteIndex(lo), width = (whiteIndex(hi) - startWI + 1) * o.W;
  let whites='', blacks='', labels='';
  for (let m=lo; m<=hi; m++) if (!isBlack(m)) {
    const x = (whiteIndex(m)-startWI)*o.W, on = active.has(m);
    whites += `<rect class="wk${on?' on':''}" x="${x}" y="0" width="${o.W}" height="${o.H}" rx="2"/>`;
    if (on && o.labels) labels += `<text x="${x+o.W/2}" y="${o.H-10}">${pretty(active.get(m))}</text>`;
  }
  for (let m=lo; m<=hi; m++) if (isBlack(m)) {
    const x = (whiteIndex(m+1)-startWI)*o.W - o.BW/2, on = active.has(m);
    blacks += `<rect class="bk${on?' on':''}" x="${x}" y="0" width="${o.BW}" height="${o.BH}" rx="2"/>`;
    if (on && o.labels) labels += `<text x="${x+o.BW/2}" y="${o.BH-10}" fill="#000">${pretty(active.get(m))}</text>`;
  }
  const label = notes.map(n=>pretty(n.name)).join(' ');
  return `<svg class="kbd" viewBox="-1 -1 ${width+2} ${o.H+2}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${label}">${whites}${blacks}${labels}</svg>`;
}

// ============ storage (best effort) ============
const mem = {};
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ mem[k]=v; try { localStorage.setItem(k,v); } catch(e){} }
};

// ============ state ============
let root = 'C', typeId = 'maj7';
let lists = { song: [], find: [] };     // items: {r:rootIdx, t:typeIdx, v:'A'|'B'}
let findTitle = '';
const TUNES = JSON.parse(document.getElementById('tunedata').textContent);
const TITLES = Object.keys(TUNES);

function save() {
  store.set('lhv', JSON.stringify({ song: lists.song, find: lists.find, findTitle, root, typeId }));
}
function load() {
  try {
    const d = JSON.parse(store.get('lhv') || '{}');
    if (Array.isArray(d.song)) lists.song = d.song;
    if (Array.isArray(d.find)) lists.find = d.find;
    if (typeof d.findTitle === 'string') findTitle = d.findTitle;
    if (ROOTS.includes(d.root)) root = d.root;
    if (TYPES.some(t=>t.id===d.typeId)) typeId = d.typeId;
  } catch(e){}
}

function makeDropdown(el, items, cols, getValue, setValue, label) {
  let focusIdx = -1;
  el.style.setProperty('--cols', cols);
  el.innerHTML = `
    <button class="dd-btn" type="button" aria-haspopup="listbox" aria-label="${label}"><span class="dd-txt"></span></button>
    <ul class="dd-list" role="listbox" aria-label="${label}">
      ${items.map((i,idx)=>`<li role="option" data-idx="${idx}">${i.text}</li>`).join('')}
    </ul>`;
  const btn = el.querySelector('.dd-btn'), txt = btn.querySelector('.dd-txt'), lis = [...el.querySelectorAll('li')];
  function sync() {
    const v = getValue();
    txt.innerHTML = items.find(i=>i.value===v).text;
    lis.forEach((li,idx)=>{ li.setAttribute('aria-selected', items[idx].value===v); li.classList.toggle('focus', idx===focusIdx); });
  }
  const isOpen = () => el.getAttribute('aria-expanded') === 'true';
  function open() {
    closeAll(); focusIdx = items.findIndex(i=>i.value===getValue());
    el.setAttribute('aria-expanded','true'); sync();
    const list = el.querySelector('.dd-list');
    if (list.getBoundingClientRect().bottom > window.innerHeight) el.scrollIntoView({ block:'start', behavior:'smooth' });
  }
  function close(){ el.setAttribute('aria-expanded','false'); focusIdx=-1; sync(); }
  function choose(i){ setValue(items[i].value); close(); btn.focus(); }
  btn.addEventListener('click', ()=> isOpen() ? close() : open());
  lis.forEach(li => li.addEventListener('click', ()=> choose(+li.dataset.idx)));
  el.addEventListener('keydown', e => {
    if (!isOpen()) { if (['ArrowDown','ArrowUp'].includes(e.key)) { e.preventDefault(); open(); } return; }
    const step = { ArrowDown:cols, ArrowUp:-cols, ArrowRight:1, ArrowLeft:-1 }[e.key];
    if (step !== undefined) { e.preventDefault(); focusIdx = Math.max(0, Math.min(items.length-1, focusIdx+step)); sync(); }
    else if (e.key === 'Escape') { e.preventDefault(); close(); }
    else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (focusIdx>=0) choose(focusIdx); }
    else if (e.key === 'Tab') close();
  });
  el._close = close; el._sync = sync; sync();
}
function closeAll(){ document.querySelectorAll('.dd[aria-expanded="true"]').forEach(d=>d._close()); }
document.addEventListener('pointerdown', e => { if (!e.target.closest('.dd')) closeAll(); });

// ============ build tab ============
function renderOut() {
  const t = TYPES.find(x=>x.id===typeId);
  const block = (letter, notes, formula, bottom) => `
    <section class="voicing">
      <div class="vhead">
        <div class="notes">${notes.map(n=>prettyHTML(n.name)).join('-')}</div>
        <div class="vmeta">
          <div>
            <div class="formula">${formula}</div>
            <div class="vsub">${bottom} at the bottom</div>
          </div>
          <button class="addbtn" type="button" data-add="${letter}" title="Add Type ${letter} to Song" aria-label="Add Type ${letter} to Song">+</button>
        </div>
      </div>
      ${keyboardSVG(notes)}
    </section>`;
  document.getElementById('out').innerHTML =
    block('A', buildVoicing(root, t.A), t.show.A, 'Third') +
    block('B', buildVoicing(root, t.B), t.show.B, 'Seventh');
  save();
}
document.getElementById('out').addEventListener('click', e => {
  const b = e.target.closest('[data-add]'); if (!b) return;
  lists.song.push({ r: ROOTS.indexOf(root), t: TYPE_IDX[typeId], v: b.dataset.add });
  save(); renderList('song');
  const t = TYPES.find(x=>x.id===typeId);
  toast(`Added ${pretty(root)}${t.sym} (Type ${b.dataset.add})`, null);
});

// ============ card lists ============
function chordSym(it){ return pretty(ROOTS[it.r]) + TYPES[it.t].sym; }
function chordNotes(it){ const T = TYPES[it.t]; return buildVoicing(ROOTS[it.r], it.v==='A' ? T.A : T.B); }

function cardHTML(it, i) {
  const notes = chordNotes(it);
  return `<div class="card" data-i="${i}">
    <div class="ab">${it.v}</div>
    <div class="sym">${wrapAcc(chordSym(it))}</div>
    <div class="nts">${notes.map(n=>prettyHTML(n.name)).join('-')}</div>
    <div class="mk">${keyboardSVG(notes, { pad:1, W:14, H:44, BW:8, BH:27, labels:false })}</div>
    <button class="rm" type="button" data-rm="${i}" aria-label="Remove ${chordSym(it)}">×</button>
  </div>`;
}

function renderList(key) {
  const grid = document.getElementById(key+'-grid');
  const wrap = document.getElementById(key+'-fit');
  const empty = document.getElementById(key+'-empty');
  const arr = lists[key];
  document.getElementById(key+'-count').textContent = arr.length ? `${arr.length} chord${arr.length>1?'s':''}` : '';
  empty.hidden = arr.length > 0;
  grid.innerHTML = arr.map(cardHTML).join('');
  fit(key);
  requestAnimationFrame(()=>fit(key));
  if (key === 'find') document.getElementById('find-copy').hidden = arr.length === 0;
}

// pick the fewest columns that still fit on one screen; CSS grid stretches them to fill the row
function fit(key) {
  const grid = document.getElementById(key+'-grid'), wrap = document.getElementById(key+'-fit');
  if (!grid.children.length) { wrap.style.height=''; return; }
  wrap.style.height = '';
  const avail = Math.max(160, window.innerHeight - wrap.getBoundingClientRect().top - 34);
  const n = grid.children.length, GAP = 6, MINW = 56, MAXFS = 230;
  const first = grid.firstElementChild;
  const apply = c => {
    grid.style.setProperty('--cols', c);
    const w = first.getBoundingClientRect().width;
    const fs = Math.min(w, MAXFS);
    grid.style.setProperty('--cw', w + 'px');
    grid.style.setProperty('--fs', fs + 'px');
    grid.style.setProperty('--pad', Math.max(4, fs*0.045) + 'px');
    return first.getBoundingClientRect().height;
  };
  const maxCols = Math.max(1, Math.floor((grid.getBoundingClientRect().width + GAP) / (MINW + GAP)));
  const cap = Math.min(n, maxCols);
  let chosen = cap;
  for (let c = 1; c <= cap; c++) {
    const h = apply(c), rows = Math.ceil(n / c);
    if (rows*h + (rows-1)*GAP <= avail + 1) { chosen = c; break; }
  }
  apply(chosen);
  wrap.style.height = avail + 'px';
}
let refitPending = false;
function refit() {
  if (refitPending) return;
  refitPending = true;
  requestAnimationFrame(() => { refitPending = false; ['song','find'].forEach(fit); });
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
window.addEventListener('resize', refit);

// ---- toast / undo ----
let toastTimer = null, undoFn = null;
const toastEl = document.getElementById('toast');
function toast(msg, undo) {
  document.getElementById('toast-msg').textContent = msg;
  undoFn = undo;
  document.getElementById('toast-undo').hidden = !undo;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> toastEl.classList.remove('show'), undo ? 6000 : 2200);
}
document.getElementById('toast-undo').addEventListener('click', () => {
  if (undoFn) undoFn();
  undoFn = null; toastEl.classList.remove('show');
});

// ---- interactions: tap = flip A/B, drag = reorder, × = remove ----
function wireList(key) {
  const grid = document.getElementById(key+'-grid');

  grid.addEventListener('click', e => {
    const rm = e.target.closest('[data-rm]'); if (!rm) return;
    e.stopPropagation();
    const i = +rm.dataset.rm, item = lists[key][i];
    lists[key].splice(i,1); save(); renderList(key);
    toast(`Removed ${pretty(ROOTS[item.r])}${TYPES[item.t].sym}`, () => {
      lists[key].splice(i,0,item); save(); renderList(key);
    });
  });

  let st = null;
  grid.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-rm]')) return;
    const card = e.target.closest('.card'); if (!card) return;
    const r = card.getBoundingClientRect();
    st = { card, i:+card.dataset.i, x:e.clientX, y:e.clientY, dx:e.clientX-r.left, dy:e.clientY-r.top, w:r.width, moved:false, ghost:null, target:null };
    card.setPointerCapture(e.pointerId);
  });

  grid.addEventListener('pointermove', e => {
    if (!st) return;
    if (!st.moved && Math.hypot(e.clientX-st.x, e.clientY-st.y) < 8) return;
    if (!st.moved) {
      st.moved = true;
      const g = st.card.cloneNode(true);
      g.classList.add('ghost'); g.style.width = st.w + 'px';
      g.style.setProperty('--cw', getComputedStyle(grid).getPropertyValue('--cw'));
      g.style.setProperty('--fs', getComputedStyle(grid).getPropertyValue('--fs'));
      g.style.setProperty('--pad', getComputedStyle(grid).getPropertyValue('--pad'));
      document.body.appendChild(g);
      st.ghost = g; st.card.classList.add('dragging');
    }
    st.ghost.style.left = (e.clientX - st.dx) + 'px';
    st.ghost.style.top  = (e.clientY - st.dy) + 'px';
    // nearest card centre
    let bestI = st.i, bestD = Infinity;
    [...grid.children].forEach(c => {
      const b = c.getBoundingClientRect();
      const d = Math.hypot(e.clientX - (b.left+b.width/2), e.clientY - (b.top+b.height/2));
      if (d < bestD) { bestD = d; bestI = +c.dataset.i; }
    });
    st.target = bestI;
  });

  function end(e) {
    if (!st) return;
    const s = st; st = null;
    if (s.ghost) s.ghost.remove();
    s.card.classList.remove('dragging');
    if (!s.moved) {
      const it = lists[key][s.i];
      it.v = it.v === 'A' ? 'B' : 'A';
      save(); renderList(key);
    } else if (s.target !== null && s.target !== s.i) {
      const [it] = lists[key].splice(s.i, 1);
      lists[key].splice(s.target, 0, it);
      save(); renderList(key);
    }
  }
  grid.addEventListener('pointerup', end);
  grid.addEventListener('pointercancel', end);
}
wireList('song'); wireList('find');

document.getElementById('song-clear').addEventListener('click', () => {
  if (!lists.song.length) return;
  const old = lists.song; lists.song = []; save(); renderList('song');
  toast(`Cleared ${old.length} chords`, () => { lists.song = old; save(); renderList('song'); });
});
document.getElementById('find-copy').addEventListener('click', () => {
  const old = lists.song.slice();
  lists.song = lists.find.map(x => ({...x}));
  save(); renderList('song'); showTab('song');
  toast(`Loaded ${findTitle} into Song`, () => { lists.song = old; save(); renderList('song'); });
});

// ============ search ============
const q = document.getElementById('q'), ac = document.getElementById('ac');
let acItems = [], acFocus = -1;
const norm = s => s.toLowerCase().replace(/[^a-z0-9 ]/g,'');
const NORM_TITLES = TITLES.map(t => ({ t, n: norm(t) }));

function search(term) {
  const n = norm(term).trim();
  if (!n) return [];
  const starts = [], words = [], has = [];
  for (const o of NORM_TITLES) {
    if (o.n.startsWith(n)) starts.push(o.t);
    else if (o.n.includes(' ' + n)) words.push(o.t);
    else if (o.n.includes(n)) has.push(o.t);
    if (starts.length > 40) break;
  }
  return [...starts, ...words, ...has].slice(0, 25);
}
function renderAC() {
  if (!acItems.length) { ac.classList.remove('open'); ac.innerHTML=''; return; }
  ac.innerHTML = acItems.map((t,i)=>`<div data-i="${i}"${i===acFocus?' class="focus"':''}>${t.replace(/</g,'&lt;')}</div>`).join('');
  ac.classList.add('open');
}
const qclear = document.getElementById('qclear');
function syncClear(){ qclear.hidden = !q.value && !lists.find.length; }
q.addEventListener('input', () => { acItems = search(q.value); acFocus = -1; renderAC(); syncClear(); });
qclear.addEventListener('click', () => {
  const old = lists.find, oldTitle = findTitle;
  q.value = ''; acItems = []; renderAC();
  lists.find = []; findTitle = '';
  document.getElementById('find-title').textContent = '';
  save(); renderList('find'); syncClear(); q.focus();
  if (old.length) toast(`Closed ${oldTitle}`, () => {
    lists.find = old; findTitle = oldTitle; q.value = oldTitle;
    document.getElementById('find-title').textContent = oldTitle;
    save(); renderList('find'); syncClear();
  });
});
q.addEventListener('keydown', e => {
  if (!acItems.length) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); acFocus = Math.min(acItems.length-1, acFocus+1); renderAC(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); acFocus = Math.max(0, acFocus-1); renderAC(); }
  else if (e.key === 'Enter') { e.preventDefault(); pick(acItems[acFocus < 0 ? 0 : acFocus]); }
  else if (e.key === 'Escape') { acItems=[]; renderAC(); }
});
ac.addEventListener('click', e => { const d = e.target.closest('[data-i]'); if (d) pick(acItems[+d.dataset.i]); });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.searchwrap')) { acItems=[]; renderAC(); } });

function pick(title) {
  if (!title) return;
  const s = TUNES[title]; if (!s) return;
  findTitle = title;
  lists.find = [];
  const seen = new Set();
  for (let i = 0; i < s.length; i += 2) {
    const code = s.slice(i, i+2);
    if (seen.has(code)) continue;
    seen.add(code);
    lists.find.push({ r: parseInt(s[i],16), t: +s[i+1], v: 'A' });
  }
  q.value = title; q.blur(); acItems = []; renderAC();
  document.getElementById('find-title').textContent = title;
  save(); renderList('find'); syncClear();
}

// ============ tabs ============
function showTab(which) {
  const map = { build:'p-build', song:'p-song', find:'p-find' };
  for (const k in map) {
    document.getElementById('tab-'+k).setAttribute('aria-selected', k===which);
    document.getElementById(map[k]).hidden = (k !== which);
  }
  if (which === 'song' || which === 'find') fit(which);
}
['build','song','find'].forEach(k => document.getElementById('tab-'+k).addEventListener('click', () => showTab(k)));

// ============ boot ============
load();
makeDropdown(document.getElementById('roots'), ROOTS.map(r=>({ value:r, text:prettyHTML(r) })), 4, ()=>root, v=>{ root=v; renderOut(); }, 'Root');
makeDropdown(document.getElementById('types'), TYPES.map(t=>({ value:t.id, text:wrapAcc(t.label) })), 1, ()=>typeId, v=>{ typeId=v; renderOut(); }, 'Chord type');
renderOut();
if (findTitle) { q.value = findTitle; document.getElementById('find-title').textContent = findTitle; }
renderList('song'); renderList('find'); syncClear();
</script>
