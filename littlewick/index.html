<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14121c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Little Wick</title>
<style>
  :root {
    --shell: #1b1824;
    --shell-hi: #282434;
    --shell-lo: #110f17;
    --ink: #d9cfc0;
    --ink-dim: #8a8196;
    --btn-a: #d8434e;
    --btn-b: #e8b33c;
    --btn-x: #4a7fd6;
    --btn-y: #3fa66a;
    --pad: #2b2737;
    --pad-hi: #3a3549;
    --bezel: #0b0a0f;
    --gutter: 16px;
    --ctl: 1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: var(--shell-lo);
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body {
    background:
      radial-gradient(120% 70% at 50% 0%, #262132 0%, transparent 60%),
      linear-gradient(180deg, #1a1722 0%, #121019 100%);
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* ---------- viewport ---------- */
  #screen-wrap {
    position: relative;
    flex: 0 0 auto;
    background: var(--bezel);
    border-radius: 6px;
    box-shadow: 0 0 0 2px #000, 0 10px 30px rgba(0,0,0,.55), inset 0 0 0 1px #2a2633;
    padding: 6px;
    margin-top: 10px;
  }
  /* power LED on the bezel: a tiny warm flame that never quite holds still */
  .led {
    position: absolute; left: 12px; bottom: 6px; display: none; align-items: center; gap: 6px;
    font-size: 7px; font-weight: 800; letter-spacing: .2em; color: #5f586e; pointer-events: none;
  }
  .led i {
    display: block; width: 6px; height: 6px; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #fff3c4, #ffb347 45%, #e2621b);
    box-shadow: 0 0 6px 1px rgba(255,150,50,.55);
    animation: wick 3.2s infinite steps(1);
  }
  @keyframes wick { 0%{opacity:1} 37%{opacity:.82} 41%{opacity:1} 68%{opacity:.9} 71%{opacity:1} }
  @media (prefers-reduced-motion: reduce) { .led i { animation: none; } }
  body.touch:not(.landscape) #screen-wrap { padding-bottom: 18px; }
  body.touch:not(.landscape) .led { display: flex; }
  /* speaker grille (decoration) */
  .grille {
    position: absolute; right: 34px; bottom: 44px;
    display: flex; gap: 7px; transform: rotate(-30deg); pointer-events: none;
  }
  .grille i {
    display: block; width: 6px; height: 36px; border-radius: 3px; background: #0d0c13;
    box-shadow: inset 0 2px 3px rgba(0,0,0,.7), 0 1px 0 rgba(255,255,255,.06);
  }
  body:not(.roomy) .grille, body.touch.landscape .grille { display: none; }
  #screen {
    display: block;
    /* nearest-neighbour upscaling of the native 256x224 frame (last supported value wins) */
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    background: #000;
    border-radius: 2px;
  }
  /* ---------- controller ---------- */
  #pad {
    position: relative;
    flex: 1 1 auto;
    width: 100%;
    max-width: 520px;
    display: none;
    touch-action: none;
  }
  body.touch #pad { display: block; }
  #brand {
    position: absolute; left: 0; right: 0; top: 8px;
    text-align: center;
    font-size: 11px; letter-spacing: .32em; font-weight: 700;
    color: var(--ink-dim);
    opacity: .75;
    pointer-events: none;
  }
  #brand b { color: #e9a85b; font-weight: 800; }
  .dpad {
    position: absolute;
    width: 156px; height: 156px;
    left: 22px;
    top: 50%; transform: translateY(-46%) scale(var(--ctl)); transform-origin: left center;
    touch-action: none;
  }
  /* invisible margin that extends the touch target past the drawn d-pad / face buttons
     (matters in landscape, where only the controls themselves receive touches) */
  .dpad::before, .face::before { content: ''; position: absolute; inset: -22px; }
  .face::before { inset: -14px; }
  /* recessed wells moulded into the shell behind the d-pad and the face-button diamond */
  .dpad::after, .face::after {
    content: ''; position: absolute; z-index: -1; border-radius: 50%; pointer-events: none;
    background: radial-gradient(closest-side, rgba(0,0,0,.30), rgba(0,0,0,.16) 74%, rgba(255,255,255,.04) 93%, transparent 100%);
  }
  .dpad::after { inset: -9px; }
  .face::after { inset: -7px; }
  .dpad .arm {
    position: absolute; background: linear-gradient(180deg, var(--pad-hi), var(--pad));
    box-shadow: 0 3px 0 #0c0b10, inset 0 1px 0 rgba(255,255,255,.08);
    border-radius: 8px;
  }
  .dpad .h { left: 4px; right: 4px; top: 54px; height: 48px; }
  .dpad .v { top: 4px; bottom: 4px; left: 54px; width: 48px; }
  .dpad .hub { position: absolute; left: 62px; top: 62px; width: 32px; height: 32px; border-radius: 50%;
    background: radial-gradient(circle at 50% 40%, #2f2a3c, #221e2c); box-shadow: inset 0 2px 3px rgba(0,0,0,.5); }
  .dpad .tri { position: absolute; width: 0; height: 0; border: 8px solid transparent; opacity: .55; }
  .dpad .tri.u { left: 70px; top: 14px; border-bottom-color: var(--ink-dim); }
  .dpad .tri.d { left: 70px; bottom: 14px; border-top-color: var(--ink-dim); }
  .dpad .tri.l { top: 70px; left: 14px; border-right-color: var(--ink-dim); }
  .dpad .tri.r { top: 70px; right: 14px; border-left-color: var(--ink-dim); }
  .dpad.on-u .tri.u { border-bottom-color: #fff; opacity: 1; }
  .dpad.on-d .tri.d { border-top-color: #fff; opacity: 1; }
  .dpad.on-l .tri.l { border-right-color: #fff; opacity: 1; }
  .dpad.on-r .tri.r { border-left-color: #fff; opacity: 1; }
  .dpad.on-u .v, .dpad.on-d .v, .dpad.on-l .h, .dpad.on-r .h { background: linear-gradient(180deg, #443e55, #353043); }

  .face {
    position: absolute; right: 18px; top: 50%; transform: translateY(-46%) scale(var(--ctl)); transform-origin: right center;
    width: 176px; height: 176px;
  }
  .btn {
    position: absolute; width: 60px; height: 60px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-weight: 800; font-size: 20px; color: rgba(255,255,255,.92);
    text-shadow: 0 1px 0 rgba(0,0,0,.35);
    box-shadow: 0 4px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.28), inset 0 -3px 6px rgba(0,0,0,.25);
    touch-action: none;
    transition: transform .04s, box-shadow .04s, filter .04s;
  }
  .btn small { font-size: 8px; letter-spacing: .12em; font-weight: 800; opacity: .85; margin-top: -1px; }
  .btn.long small { font-size: 7px; letter-spacing: .04em; }
  .btn.down { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.2), inset 0 -2px 4px rgba(0,0,0,.25); filter: brightness(1.15); }
  /* nothing to do with this button right now (e.g. X outside a dungeon, Y with no item) */
  .btn.off { filter: saturate(.3) brightness(.62); }
  .btn.off small { opacity: .55; }
  /* face buttons by position (class = game function: a action/right, b sword/bottom, x map/top, y item/left);
     letters and colours follow the layout shown: Xbox by default, PlayStation / Nintendo once seen */
  .btn.a { background: radial-gradient(circle at 40% 30%, var(--a-hi), var(--a-lo)); color: var(--a-ink); right: 0; top: 58px; }
  .btn.b { background: radial-gradient(circle at 40% 30%, var(--b-hi), var(--b-lo)); color: var(--b-ink); left: 58px; bottom: 0; }
  .btn.x { background: radial-gradient(circle at 40% 30%, var(--x-hi), var(--x-lo)); color: var(--x-ink); left: 58px; top: 0; }
  .btn.y { background: radial-gradient(circle at 40% 30%, var(--y-hi), var(--y-lo)); color: var(--y-ink); left: 0; top: 58px; }
  body { /* Xbox: B red right, A green bottom, Y yellow top, X blue left */
    --a-hi: #ef6b74; --a-lo: var(--btn-a); --a-ink: #fff;
    --b-hi: #6cc790; --b-lo: var(--btn-y); --b-ink: #fff;
    --x-hi: #f6cf6e; --x-lo: var(--btn-b); --x-ink: #4a3200;
    --y-hi: #77a2ea; --y-lo: var(--btn-x); --y-ink: #fff;
  }
  body.lay-nin { /* Nintendo / SNES: A red right, B yellow bottom, X blue top, Y green left */
    --b-hi: #f6cf6e; --b-lo: var(--btn-b); --b-ink: #4a3200;
    --x-hi: #77a2ea; --x-lo: var(--btn-x); --x-ink: #fff;
    --y-hi: #6cc790; --y-lo: var(--btn-y); --y-ink: #fff;
  }
  body.lay-ps { /* PlayStation: ○ red right, ✕ blue bottom, △ teal top, □ pink left */
    --b-hi: #77a2ea; --b-lo: var(--btn-x); --b-ink: #fff;
    --x-hi: #5fd0b8; --x-lo: #2e9e88; --x-ink: #fff;
    --y-hi: #f39ac8; --y-lo: #d0619c; --y-ink: #fff;
  }
  .btn.a, .btn.b, .btn.x, .btn.y { text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  .btn.x { text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  body.lay-nin .btn.x, body.lay-ps .btn.x { text-shadow: 0 1px 0 rgba(0,0,0,.25); }
  body.lay-nin .btn.b { text-shadow: 0 1px 0 rgba(255,255,255,.35); }
  .btn.b { width: 66px; height: 66px; left: 55px; bottom: -4px; }
  .sys {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 14px; /* #pad already sits inside #app's safe-area padding */
    display: flex; gap: 22px;
  }
  .pill {
    position: relative;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    font-size: 9px; font-weight: 800; letter-spacing: .16em; color: var(--ink-dim);
    touch-action: none;
  }
  .pill i {
    display: block; width: 46px; height: 14px; border-radius: 8px;
    background: linear-gradient(180deg, #3a3549, #2a2636);
    box-shadow: 0 2px 0 #0c0b10, inset 0 1px 0 rgba(255,255,255,.08);
    transform: rotate(-18deg);
  }
  /* the drawn pill is small; the touch target is a comfortable ~66x49 */
  .pill::before { content: ''; position: absolute; inset: -3px -12px -10px; }
  .pill.down i { transform: rotate(-18deg) translateY(2px); box-shadow: none; filter: brightness(1.3); }
  #hint {
    margin-top: 12px; font-size: 12px; color: var(--ink-dim); text-align: center; line-height: 1.6;
    letter-spacing: .02em;
  }
  #hint kbd {
    display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 4px;
    background: #2a2636; color: var(--ink); font: 700 11px/18px ui-monospace, monospace;
    box-shadow: 0 2px 0 #0c0b10;
  }
  body.touch #hint, body.nohint #hint { display: none; }
  /* a controller in use: hide the touch buttons (a touch brings them back) and swap the key hints */
  body.touch.padmode #pad { display: none; }
  body.touch.padmode #app { justify-content: center; }
  body.touch.padmode #screen-wrap { margin-top: 0; }
  #hint .gp, body.padmode #hint .kb { display: none; }
  body.padmode #hint .gp { display: inline; }
  #padnote:not([hidden]) { display: block; color: #c8a060; }
  body.nonote #padnote { display: none; }
  /* the sound note sits in the side gutter, off the picture, when there's no room above it (see loop.ts) */
  body.sidenote #soundhint {
    left: max(8px, env(safe-area-inset-left, 0px)); top: 50%; transform: translateY(-50%);
    max-width: var(--note-w, 160px);
  }
  #soundhint {
    position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 20;
    width: max-content; max-width: calc(100vw - 32px); text-align: center;
    padding: 6px 14px; border-radius: 999px; background: rgba(12,10,18,.88); color: var(--ink);
    font: 600 13px/1.4 system-ui, sans-serif; letter-spacing: .02em; pointer-events: none;
    box-shadow: 0 2px 10px rgba(0,0,0,.5);
  }
  body:not(.touch) #app { justify-content: center; }
  body:not(.touch) #screen-wrap { margin-top: 0; }
  /* landscape on touch devices: controls flank the screen */
  body.touch.landscape #app { flex-direction: row; justify-content: center; align-items: center; }
  body.touch.landscape #screen-wrap { margin-top: 0; }
  body.touch.landscape #pad { position: fixed; inset: 0; max-width: none; pointer-events: none; }
  body.touch.landscape #pad > * { pointer-events: auto; }
  body.touch.landscape .dpad { left: max(14px, env(safe-area-inset-left)); top: 58%; }
  body.touch.landscape .face { right: max(10px, env(safe-area-inset-right)); top: 58%; }
  body.touch.landscape .sys { left: auto; right: max(26px, env(safe-area-inset-right)); top: 12px; bottom: auto; transform: none; }
  body.touch.landscape #brand { display: none; }
  body.touch.landscape .dpad, body.touch.landscape .face { opacity: .85; }
</style>
</head>
<body>
<div id="app">
  <div id="screen-wrap"><canvas id="screen" width="256" height="224"></canvas><div class="led"><i></i>POWER</div></div>
  <div id="hint">
    <span class="kb"><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> move &nbsp; <kbd>X</kbd>/<kbd>K</kbd> action &nbsp; <kbd>Z</kbd>/<kbd>J</kbd> sword &nbsp;
    <kbd>C</kbd>/<kbd>L</kbd> item &nbsp; <kbd>V</kbd> map &nbsp; <kbd>Enter</kbd> pause &nbsp; <kbd>Shift</kbd> ask Pim</span>
    <span class="gp"></span>
    <span id="padnote" hidden></span>
  </div>
  <div id="soundhint" hidden></div>
  <div id="pad">
    <div id="brand">LITTLE <b>WICK</b></div>
    <div class="dpad" id="dpad">
      <div class="arm h"></div><div class="arm v"></div><div class="hub"></div>
      <div class="tri u"></div><div class="tri d"></div><div class="tri l"></div><div class="tri r"></div>
    </div>
    <div class="face">
      <div class="btn x" data-btn="x">Y<small>MAP</small></div>
      <div class="btn y" data-btn="y">X<small>ITEM</small></div>
      <div class="btn a" data-btn="a">B<small>ACTION</small></div>
      <div class="btn b" data-btn="b">A<small>SWORD</small></div>
    </div>
    <div class="grille"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sys">
      <div class="pill" data-btn="select"><i></i>SELECT</div>
      <div class="pill" data-btn="start"><i></i>START</div>
    </div>
  </div>
</div>
